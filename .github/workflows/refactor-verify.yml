# SPDX-License-Identifier: GPL-3.0-or-later
name: Verify Updates controller refactor

on:
  push:
    branches: [refactor/updates-controller-0.3.69]

permissions:
  contents: read

jobs:
  verify-refactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply extraction in verification workspace
        run: |
          python3 tools/refactor_updates_controller.py
          git diff --check
          python3 tests/source_contracts.py

      - name: Upload transformed sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updates-controller-refactor
          path: |
            src/app/main.cpp
            CMakeLists.txt
            tests/source_contracts.py
          if-no-files-found: error

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream build-essential cmake debhelper dpkg-dev dbus-daemon gdb git gpgv libappstream-dev libcurl4-openssl-dev libgtk-3-dev libgtk-4-dev libglib2.0-dev libjson-glib-dev liblzma-dev libsqlite3-dev libxapp-dev pkg-config xvfb zlib1g-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Engine service smoke test
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 3s dbus-run-session -- ./build/infiltrator-software-engine >engine.out 2>engine.err
          status=$?
          set -e
          cat engine.out || true
          cat engine.err || true
          if [[ "$status" -ne 124 ]]; then
            exit "$status"
          fi

      - name: Launch smoke test
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 20s xvfb-run -a ./build/infiltrator-software >launch.out 2>launch.err
          status=$?
          set -e
          cat launch.out || true
          cat launch.err || true
          if [[ "$status" -ne 124 ]]; then
            exit "$status"
          fi

  commit-refactor:
    needs: verify-refactor
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/updates-controller-0.3.69
          fetch-depth: 0
          submodules: recursive

      - name: Commit exact verified extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/refactor_updates_controller.py
          if git diff --quiet; then
            exit 0
          fi
          git diff --check
          python3 tests/source_contracts.py
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add src/app/main.cpp CMakeLists.txt tests/source_contracts.py
          git commit -m "Extract update orchestration from app shell"
          git push origin HEAD:refactor/updates-controller-0.3.69
