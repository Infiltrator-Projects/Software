name: One-shot branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-cleanup.yml

permissions:
  contents: write

jobs:
  prune:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete stale remote branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'fix/app-policy-decoupling'
            'refactor/remove-dead-alias-build-flags'
            'refactor/repair-coupling-0.3.78'
            'release/0.3.78'
            'release/0.3.79'
            'release-pipeline-simplification'
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

          remaining="$(git ls-remote --heads origin | sed 's#.*refs/heads/##' | sort)"
          test "$remaining" = 'main' || {
            printf 'Unexpected branches remain:\n%s\n' "$remaining" >&2
            exit 1
          }
