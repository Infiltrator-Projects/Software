# SPDX-License-Identifier: GPL-3.0-or-later
name: Update Software 0.3.63 forensic source contracts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-0.3.63-source-contracts.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Update 0.3.63 forensic source contracts'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: false

      - name: Replace retired visual assertions with current contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "0.3.63"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()

          replacements = {
              'assert ".hero-ribbon-a" in theme': 'assert ".hero-ribbon-a" not in theme',
              'assert "state->global_search, 320, -1" in app': 'assert "state->global_search, 200, -1" in app',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one CI contract match for {old!r}, found {count}')
              text = text.replace(old, new, 1)

          anchor = 'assert "button.window-control { min-width: 30px; min-height: 30px" in theme\n'
          if text.count(anchor) != 1:
              raise SystemExit('titlebar source-contract anchor mismatch')
          text = text.replace(
              anchor,
              anchor
              + 'assert "legacy CI marker" not in app\n'
              + 'assert "legacy CI text marker" not in theme\n'
              + 'assert \'.nav-discover image\' not in theme\n'
              + 'assert \'.page-updates .card\' not in theme\n'
              + 'assert \"nav-discover\" not in app\n',
              1)

          tray_anchor = 'assert "hide_tray" in tray\n'
          if text.count(tray_anchor) != 1:
              raise SystemExit('tray source-contract anchor mismatch')
          text = text.replace(
              tray_anchor,
              tray_anchor
              + 'assert "refresh_runtime_inputs" in tray\n'
              + 'assert "if (runtime_changed)" in tray\n'
              + 'assert "const std::string override = read_override();" not in tray\n',
              1)

          path.write_text(text)
          PY

          rm .github/workflows/update-0.3.63-source-contracts.yml
          git diff --check
          grep -Fq 'assert ".hero-ribbon-a" not in theme' .github/workflows/ci.yml
          grep -Fq 'assert "state->global_search, 200, -1" in app' .github/workflows/ci.yml
          grep -Fq 'assert "refresh_runtime_inputs" in tray' .github/workflows/ci.yml

          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git commit -m 'Update 0.3.63 current UI and tray source contracts'
          git push origin HEAD:main
