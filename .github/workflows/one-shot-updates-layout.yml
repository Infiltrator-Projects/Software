# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot Updates layout correction

on:
  push:
    branches: [fix/updates-layout-0.3.67]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[layout-fix-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out branch and Common
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply Updates layout correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {label}")
              return text.replace(old, new, 1)

          app_path = Path("src/app/main.cpp")
          app = app_path.read_text()

          # Rebuild one update row so all semantic chips share the same title
          # line and the lower metadata is one compact line instead of two.
          start = app.index("GtkWidget *make_update_row(")
          end = app.index("\nint update_group_index", start)
          new_update_row = r'''GtkWidget *make_update_row(
              WindowState *state,
              const PackageRecord &package)
          {
              GtkWidget *row = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 10);
              gtk_widget_add_css_class(row, "package-row");
              gtk_widget_add_css_class(row, "update-item");
              gtk_widget_set_margin_top(row, 2);
              gtk_widget_set_margin_bottom(row, 2);
              gtk_widget_set_margin_start(row, 4);
              gtk_widget_set_margin_end(row, 4);

              const std::string identity_key = update_identity(package);
              GtkWidget *selected = gtk_check_button_new();
              gtk_widget_add_css_class(selected, "update-selector");
              gtk_widget_set_tooltip_text(
                  selected, "Include this package in the update");
              gtk_widget_set_valign(selected, GTK_ALIGN_CENTER);
              gtk_check_button_set_active(
                  GTK_CHECK_BUTTON(selected),
                  state != nullptr &&
                      state->selected_update_ids.find(identity_key) !=
                          state->selected_update_ids.end());
              g_object_set_data_full(
                  G_OBJECT(selected),
                  "update-identity",
                  g_strdup(identity_key.c_str()),
                  g_free);
              g_signal_connect(
                  selected, "toggled",
                  G_CALLBACK(update_selection_toggled), state);
              gtk_box_append(GTK_BOX(row), selected);

              GtkWidget *icon_well =
                  gtk_box_new(GTK_ORIENTATION_VERTICAL, 0);
              gtk_widget_add_css_class(
                  icon_well, "update-icon-well");
              gtk_widget_set_size_request(icon_well, 40, 40);
              GtkWidget *icon =
                  make_icon(update_icon_name(package), 22);
              gtk_widget_add_css_class(icon, "package-icon");
              gtk_widget_set_halign(icon, GTK_ALIGN_CENTER);
              gtk_widget_set_valign(icon, GTK_ALIGN_CENTER);
              gtk_box_append(GTK_BOX(icon_well), icon);
              gtk_box_append(GTK_BOX(row), icon_well);

              GtkWidget *identity =
                  gtk_box_new(GTK_ORIENTATION_VERTICAL, 3);
              gtk_widget_set_hexpand(identity, true);

              GtkWidget *title_line =
                  gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 7);
              GtkWidget *name =
                  make_label(package.name.c_str(), "update-name");
              gtk_label_set_ellipsize(
                  GTK_LABEL(name), PANGO_ELLIPSIZE_END);
              gtk_widget_set_hexpand(name, true);
              gtk_box_append(GTK_BOX(title_line), name);

              const std::string kind_text(
                  infiltrator::software::package_kind_name(
                      package.kind));
              GtkWidget *kind =
                  make_label(
                      kind_text.c_str(),
                      "update-kind-chip");
              gtk_box_append(GTK_BOX(title_line), kind);

              GtkWidget *recommended =
                  make_label(
                      package.system_critical
                          ? "System-critical"
                          : "Recommended",
                      package.system_critical
                          ? "state-warning"
                          : "state-available");
              gtk_widget_add_css_class(
                  recommended, "update-recommendation-chip");
              gtk_widget_set_valign(
                  recommended, GTK_ALIGN_CENTER);
              gtk_box_append(
                  GTK_BOX(title_line), recommended);

              if (package.security_update) {
                  GtkWidget *security =
                      make_label(
                          "SECURITY",
                          "update-security-chip");
                  gtk_box_append(
                      GTK_BOX(title_line),
                      security);
              }
              gtk_box_append(GTK_BOX(identity), title_line);

              std::string source_name = package.repository_origin;
              if (source_name.empty()) {
                  source_name = package.repository_site;
              }
              if (source_name.empty()) {
                  source_name = package.source;
              }
              if (source_name.empty()) {
                  source_name = "Repository";
              }

              GtkWidget *meta_line =
                  gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 7);
              GtkWidget *from =
                  make_label(
                      package.installed_version.empty()
                          ? "Not installed"
                          : package.installed_version.c_str(),
                      "version-chip");
              GtkWidget *arrow =
                  make_label("→", "version-arrow", 0.5F);
              GtkWidget *to =
                  make_label(
                      package.available_version.c_str(),
                      "version-chip-new");
              gtk_box_append(GTK_BOX(meta_line), from);
              gtk_box_append(GTK_BOX(meta_line), arrow);
              gtk_box_append(GTK_BOX(meta_line), to);
              gtk_box_append(
                  GTK_BOX(meta_line),
                  make_label("•", "update-meta-separator", 0.5F));

              GtkWidget *source_icon =
                  make_icon("network-workgroup-symbolic", 13);
              gtk_widget_add_css_class(
                  source_icon, "update-source-icon");
              GtkWidget *source =
                  make_label(
                      source_name.c_str(), "update-source");
              gtk_label_set_ellipsize(
                  GTK_LABEL(source), PANGO_ELLIPSIZE_END);
              gtk_widget_set_hexpand(source, true);
              gtk_box_append(GTK_BOX(meta_line), source_icon);
              gtk_box_append(GTK_BOX(meta_line), source);

              std::string policy_name = "Repository default";
              if (package.policy_provider == "host-apt-preferences") {
                  policy_name = "Host preferred";
              } else if (
                  package.policy_provider == "infiltrator-distribution") {
                  policy_name = "Infiltrator preferred";
              } else if (!package.policy_provider.empty() &&
                         package.policy_provider != "repository-default") {
                  policy_name = package.policy_provider;
              }

              std::string explanation =
                  "Selection policy: " + policy_name;
              if (package.candidate_priority != 0) {
                  explanation +=
                      " • priority " +
                      std::to_string(package.candidate_priority);
              }
              if (!package.policy_reason.empty()) {
                  explanation += " • " + package.policy_reason;
              }
              if (!package.selection_reason.empty()) {
                  explanation += " " + package.selection_reason;
              }
              gtk_widget_set_tooltip_text(
                  meta_line, explanation.c_str());

              gtk_box_append(GTK_BOX(identity), meta_line);
              gtk_box_append(GTK_BOX(row), identity);

              GtkWidget *details =
                  gtk_button_new_with_label("Details");
              gtk_widget_add_css_class(
                  details, "update-details-button");
              gtk_widget_set_valign(
                  details, GTK_ALIGN_CENTER);
              auto *package_copy =
                  new PackageRecord(package);
              g_object_set_data_full(
                  G_OBJECT(details),
                  "update-package",
                  package_copy,
                  package_record_destroy);
              g_signal_connect(
                  details,
                  "clicked",
                  G_CALLBACK(update_details_clicked),
                  state);
              gtk_box_append(GTK_BOX(row), details);

              return row;
          }
          '''
          app = app[:start] + new_update_row + app[end:]

          # The page-level hierarchy is deliberately compact: status/refresh/apply
          # stay in the action strip, while selection filters belong to the list
          # they operate on.
          u_start = app.index("GtkWidget *make_updates_page(")
          u_end = app.index("\n\nvoid history_controller_changed", u_start)
          updates = app[u_start:u_end]
          updates = replace_once(
              updates,
              "GtkWidget *page = gtk_box_new(GTK_ORIENTATION_VERTICAL, 16);",
              "GtkWidget *page = gtk_box_new(GTK_ORIENTATION_VERTICAL, 10);",
              "updates page spacing")
          updates = replace_once(
              updates,
              'gtk_button_new_with_label("Security only")',
              'gtk_button_new_with_label("Security")',
              "security label")
          updates = replace_once(
              updates,
              'gtk_button_new_with_label("Kernel only")',
              'gtk_button_new_with_label("Kernel")',
              "kernel label")
          updates = replace_once(
              updates,
              'gtk_button_new_with_label("Clear selection")',
              'gtk_button_new_with_label("Clear")',
              "clear label")
          updates = replace_once(
              updates,
              "    gtk_box_append(GTK_BOX(controls), select_all);\n",
              "",
              "move select-all control")
          updates = replace_once(
              updates,
              "    gtk_box_append(\n        GTK_BOX(controls),\n        state->updates_security);\n",
              "",
              "move security control")
          updates = replace_once(
              updates,
              "    gtk_box_append(\n        GTK_BOX(controls),\n        kernel_only);\n",
              "",
              "move kernel control")
          updates = replace_once(
              updates,
              "    gtk_box_append(GTK_BOX(controls), clear_selection);\n",
              "",
              "move clear control")

          heading_anchor = "    gtk_box_append(GTK_BOX(heading_row), heading_copy);\n"
          selection_block = heading_anchor + r'''

              GtkWidget *selection_tools =
                  gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 6);
              gtk_widget_add_css_class(
                  selection_tools, "updates-selection-tools");
              gtk_widget_set_valign(
                  selection_tools, GTK_ALIGN_CENTER);
              gtk_box_append(
                  GTK_BOX(selection_tools), select_all);
              gtk_box_append(
                  GTK_BOX(selection_tools), state->updates_security);
              gtk_box_append(
                  GTK_BOX(selection_tools), kernel_only);
              gtk_box_append(
                  GTK_BOX(selection_tools), clear_selection);
              gtk_box_append(
                  GTK_BOX(heading_row), selection_tools);
          '''
          updates = replace_once(
              updates,
              heading_anchor,
              selection_block,
              "selection toolbar placement")
          app = app[:u_start] + updates + app[u_end:]
          app_path.write_text(app)

          theme_path = Path("src/app/theme.cpp")
          theme = theme_path.read_text()
          theme = replace_once(
              theme,
              '        << ".discover-details { min-height: 32px; }"\n        << ".updates-action-bar { border-color: " << warning_border\n',
              '        << ".discover-details { min-height: 32px; }"\n'
              '        << ".page-updates .hero-panel { padding: 10px 14px; }"\n'
              '        << ".page-updates .page-icon { min-width: 44px; min-height: 44px; }"\n'
              '        << ".page-updates .stat-card { padding: 8px 10px; }"\n'
              '        << ".page-updates .stat-icon-well { min-width: 34px; min-height: 34px; }"\n'
              '        << ".page-updates .stat-value { font-size: 16px; }"\n'
              '        << ".page-updates .card-info { padding: 10px 12px; }"\n'
              '        << ".updates-selection-tools button { min-height: 28px; padding: 4px 8px; }"\n'
              '        << ".updates-action-bar { padding: 8px 10px; border-color: " << warning_border\n',
              "compact updates hierarchy")
          theme = replace_once(
              theme,
              '        << ".update-group-header { margin: 9px 6px 5px 6px; padding: 10px 12px; "\n'
              '        << "background-image: linear-gradient(90deg, " << panel << ", "\n'
              '        << surface << "); border: 1px solid " << border << "; border-radius: "\n'
              '        << metrics->small_radius << "px; }"\n'
              '        << ".update-group-icon-well { min-width: 38px; min-height: 38px; "\n',
              '        << ".update-group-header { margin: 6px 6px 2px 6px; padding: 6px 8px; "\n'
              '        << "background: transparent; border: 0; border-radius: 0; }"\n'
              '        << ".update-group-icon-well { min-width: 32px; min-height: 32px; "\n',
              "flatten update group header")
          theme = replace_once(
              theme,
              '        << ".update-item { margin: 4px 5px; padding: 11px 12px; background: "\n'
              '        << card << "; border: 1px solid " << border << "; border-radius: "\n'
              '        << metrics->small_radius << "px; }"\n'
              '        << ".update-item:hover { background: " << card_hover\n'
              '        << "; border-color: " << warning_border << "; }"\n',
              '        << ".update-item { margin: 0 4px; padding: 7px 8px; background: "\n'
              '        << card << "; border: 0; border-bottom: 1px solid " << border\n'
              '        << "; border-radius: 0; }"\n'
              '        << ".update-item:hover { background: " << card_hover << "; }"\n',
              "flatten update rows")
          theme = replace_once(
              theme,
              '        << ".update-name { font-family: \\\"" << typography->ui_family\n'
              '        << "\\\"; font-size: 14px; font-weight: " << typography->ui_bold_weight\n',
              '        << ".update-name { font-family: \\\"" << typography->ui_family\n'
              '        << "\\\"; font-size: 13px; font-weight: " << typography->ui_bold_weight\n',
              "compact update title")
          theme = replace_once(
              theme,
              '        << ".update-details-button { min-height: 30px; padding: 4px 10px; "\n',
              '        << ".update-details-button { min-height: 28px; padding: 3px 9px; "\n',
              "compact details button")
          theme = replace_once(
              theme,
              '        << ".update-kind-chip { padding: 2px 7px; border-radius: 999px; "\n',
              '        << ".update-recommendation-chip { padding: 2px 7px; font-size: 9px; }"\n'
              '        << ".update-meta-separator { color: " << detail_label << "; font-size: 10px; }"\n'
              '        << ".update-kind-chip { padding: 2px 7px; border-radius: 999px; "\n',
              "aligned recommendation chip")
          theme_path.write_text(theme)

          contracts_path = Path("tests/source_contracts.py")
          contracts = contracts_path.read_text()
          contract_anchor = 'assert "graphical" in ui_vision.lower()\n'
          contract_block = contract_anchor + '''\n# Update-row hierarchy is structural: type/recommendation/security badges share\n# one title line, while selection filters belong to the update-list heading.\nassert 'gtk_box_append(\\n        GTK_BOX(title_line), recommended);' in app\nassert 'gtk_box_append(GTK_BOX(row), recommended);' not in app\nassert '"update-recommendation-chip"' in app\nassert '"updates-selection-tools"' in app\nassert 'GtkWidget *meta_line =' in app\n'''
          contracts = replace_once(
              contracts,
              contract_anchor,
              contract_block,
              "updates layout source contracts")
          contracts_path.write_text(contracts)

          Path("VERSION").write_text("0.3.67\n")

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme = replace_once(
              readme,
              "**Current source version:** 0.3.66<br>",
              "**Current source version:** 0.3.67<br>",
              "README version")
          readme_path.write_text(readme)

          changelog_path = Path("debian/changelog")
          changelog = changelog_path.read_text()
          changelog_entry = '''infiltrator-software (0.3.67) unstable; urgency=high\n\n  * Rebuild update rows so Application/System type, Recommended/System-critical\n    and Security badges share one title baseline instead of being laid out in\n    different vertical coordinate systems.\n  * Collapse version and repository metadata into one compact secondary line and\n    flatten nested group/item boxes so the update list reads as one hierarchy.\n  * Move Select all, Security, Kernel and Clear beside the Available updates\n    heading, leaving the top action strip for status, refresh and installation.\n  * Tighten Updates-only hero, summary cards, section headers and row geometry\n    without changing the current InfiltratorOS colour palette.\n  * Add source-contract coverage for the update-row chip alignment and selection\n    toolbar placement to prevent the same layout regression returning.\n\n -- Shannon Smith <infiltratr@yandex.com>  Sat, 03 Oct 2026 18:20:00 +1000\n\n'''
          if not changelog.startswith("infiltrator-software (0.3.66)"):
              raise SystemExit("unexpected changelog head")
          changelog_path.write_text(changelog_entry + changelog)

          meta_path = Path("debian/infiltrator-software.metainfo.xml")
          meta = meta_path.read_text()
          release_anchor = "  <releases>\n"
          release_entry = release_anchor + '''    <release version="0.3.67" date="2026-10-03">\n      <description>\n        <p>Restores a compact Updates hierarchy with aligned semantic badges, list-local selection controls and flatter update rows without changing the colour palette.</p>\n      </description>\n    </release>\n'''
          meta = replace_once(
              meta,
              release_anchor,
              release_entry,
              "AppStream release")
          meta_path.write_text(meta)
          PY

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream build-essential cmake debhelper dpkg-dev dbus-daemon gdb git gpgv libappstream-dev libcurl4-openssl-dev libgtk-3-dev libgtk-4-dev libglib2.0-dev libjson-glib-dev liblzma-dev libsqlite3-dev libxapp-dev pkg-config xvfb zlib1g-dev

      - name: Configure, build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          python3 tests/source_contracts.py
          appstreamcli validate debian/infiltrator-software.metainfo.xml

      - name: Graphical launch smoke test
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 12s xvfb-run -a ./build/infiltrator-software --updates >launch.out 2>launch.err
          status=$?
          set -e
          cat launch.out || true
          cat launch.err || true
          if [[ "$status" -ne 124 ]]; then
            echo "Software exited unexpectedly during Updates launch smoke test: $status" >&2
            exit "$status"
          fi

      - name: Commit tested layout correction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-updates-layout.yml
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add src/app/main.cpp src/app/theme.cpp tests/source_contracts.py VERSION README.md debian/changelog debian/infiltrator-software.metainfo.xml .github/workflows/one-shot-updates-layout.yml
          git diff --cached --check
          git commit -m "Release 0.3.67: restore compact Updates layout [layout-fix-applied]"
          git push origin HEAD:fix/updates-layout-0.3.67
