# SPDX-License-Identifier: GPL-3.0-or-later
name: Fix Software 0.3.65 sidebar selected-state styling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sidebar-selection-0365.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix Software 0.3.65 sidebar selected-state styling'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: false
      - name: Apply selected-row palette fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/theme.cpp')
          text = path.read_text()
          old = '''        << ".nav-row:hover { background: " << surface_hover << "; }"\n        << ".nav-row:selected { background: " << select_bg\n        << "; border-color: " << neutral << "; box-shadow: none; }"\n        << ".nav-icon-well { min-width: 38px; min-height: 38px; "\n'''
          new = '''        << ".nav-row:hover { background: " << surface_hover << "; }"\n        /*\n         * Use the Common selection pair explicitly and out-rank desktop-theme\n         * GtkListBoxRow defaults.  Older Mint/GTK themes can otherwise paint a\n         * selected row near-black even while Software is using the day palette.\n         */\n        << ".nav-list row.nav-row:selected { background-color: " << select_bg\n        << "; color: " << select_fg << "; border-color: " << neutral\n        << "; box-shadow: none; }"\n        << ".nav-icon-well { min-width: 38px; min-height: 38px; "\n'''
          if old not in text:
              raise SystemExit('selected row rule anchor missing')
          text = text.replace(old, new, 1)

          old = '''        << ".nav-row:selected .nav-label, .nav-row:selected .nav-subtitle { color: "\n        << accent_fg << "; }"\n        << ".nav-row image { opacity: 1; color: " << neutral << "; }"\n        << ".nav-row:selected image { color: " << accent_fg << "; }"\n'''
          new = '''        << ".nav-list row.nav-row:selected .nav-label, "\n        << ".nav-list row.nav-row:selected .nav-subtitle { color: "\n        << select_fg << "; }"\n        << ".nav-row image { opacity: 1; color: " << neutral << "; }"\n        << ".nav-list row.nav-row:selected image { color: " << select_fg << "; }"\n'''
          if old not in text:
              raise SystemExit('selected foreground rule anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text)

          changelog = Path('debian/changelog')
          c = changelog.read_text()
          anchor = '''  * Restore the current InfiltratorOS 110 ms page crossfade now that page\n    construction precedes visibility and backend refresh starts from idle.\n'''
          insert = anchor + '''  * Force sidebar selection through Common's selection background/foreground\n    pair with application-level row specificity, preventing desktop GTK themes\n    from painting selected navigation rows black in day mode.\n'''
          if anchor not in c:
              raise SystemExit('0.3.65 changelog anchor missing')
          c = c.replace(anchor, insert, 1)
          changelog.write_text(c)

          Path('.github/workflows/fix-sidebar-selection-0365.yml').unlink()
          PY

          git diff --check
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git commit -m 'Fix sidebar selected-state styling'
          git push origin HEAD:main
