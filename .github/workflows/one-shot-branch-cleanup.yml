# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-branch-cleanup.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Delete every remote branch except main
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git ls-remote --heads origin \
              | sed 's#.*refs/heads/##' \
              | sort
          )

          for branch in "${branches[@]}"; do
            [[ "$branch" == "main" ]] && continue
            git push origin --delete "$branch"
          done

          remaining="$(
            git ls-remote --heads origin \
              | sed 's#.*refs/heads/##' \
              | sort
          )"
          [[ "$remaining" == "main" ]] || {
            printf 'Unexpected branches remain:\n%s\n' "$remaining" >&2
            exit 1
          }
