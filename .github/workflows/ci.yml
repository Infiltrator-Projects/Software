# SPDX-License-Identifier: GPL-3.0-or-later
name: Verify and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Verification is meaningful only for the newest state of a ref. In
  # particular, a newer main push must retire an older same-version run before
  # that superseded commit can race the final commit to publication.
  group: verify-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.identity.outputs.version }}
      release: ${{ steps.identity.outputs.release }}

    steps:
      - name: Check out source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify source and release identity
        id: identity
        shell: bash
        run: >-
          bash tools/release.sh identity
          "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_OUTPUT"

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream build-essential cmake debhelper dpkg-dev dbus-daemon gdb git gpgv libappstream-dev libcurl4-openssl-dev libgtk-3-dev libgtk-4-dev libglib2.0-dev libjson-glib-dev liblzma-dev libsqlite3-dev libxapp-dev pkg-config xvfb zlib1g-dev

      - name: Build deterministic source bundle from tracked source
        if: steps.identity.outputs.release == 'true'
        shell: bash
        run: >-
          bash tools/release.sh source-bundle
          "${{ steps.identity.outputs.version }}"
          "$GITHUB_SHA" "$RUNNER_TEMP"

      - name: Verify update authorization and source contracts
        run: python3 tests/source_contracts.py

      - name: Build and test Debian package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x debian/rules
          # debian/rules owns the canonical release configuration and runs CTest.
          # CI compiles once and releases exactly the package that passed tests.
          dpkg-buildpackage -us -uc -b

      - name: Verify Debian package contract
        shell: bash
        run: |
          set -euo pipefail
          packages=(../infiltrator-software_"${{ steps.identity.outputs.version }}"_*.deb)
          if [[ ${#packages[@]} -ne 1 || ! -f "${packages[0]}" ]]; then
            echo "::error::Expected exactly one built Debian package for Software ${{ steps.identity.outputs.version }}."
            exit 1
          fi
          bash tests/verify_debian_package.sh "${packages[0]}"

      - name: Engine service smoke test
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 3s dbus-run-session -- ./build-deb/infiltrator-software-engine >engine.out 2>engine.err
          status=$?
          set -e
          cat engine.out || true
          cat engine.err || true
          if [[ "$status" -ne 124 ]]; then
            echo "::error::Engine service exited unexpectedly during D-Bus smoke test (status $status)."
            exit "$status"
          fi

      - name: Launch smoke test
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 20s xvfb-run -a ./build-deb/infiltrator-software >launch.out 2>launch.err
          status=$?
          set -e
          echo "launch exit status: $status"
          cat launch.out || true
          cat launch.err || true
          if grep -Fq "Embedded Discover hero raster failed to decode" launch.err; then
            echo "::error::Embedded Discover raster artwork failed to decode during the graphical smoke test."
            exit 1
          fi
          if [[ "$status" -eq 124 ]]; then
            echo "Software remained alive for the 20 second smoke window with the embedded hero loaded."
            exit 0
          fi
          echo "::error::Software exited unexpectedly during launch smoke test (status $status)."
          echo "Collecting debugger backtrace..."
          timeout 20s xvfb-run -a gdb --batch \
            -ex "set pagination off" \
            -ex run \
            -ex "thread apply all bt full" \
            --args ./build-deb/infiltrator-software || true
          exit "$status"

      - name: Validate AppStream metadata
        run: appstreamcli validate debian/infiltrator-software.metainfo.xml

      - name: Complete verified release bundle
        if: steps.identity.outputs.release == 'true'
        shell: bash
        run: >-
          bash tools/release.sh complete-bundle
          "${{ steps.identity.outputs.version }}"

      - name: Upload verified release bundle
        if: steps.identity.outputs.release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: software-release-${{ steps.identity.outputs.version }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: linux
    if: needs.linux.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: publish-release-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Check out exact verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: software-release-${{ needs.linux.outputs.version }}
          path: release

      - name: Ensure verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          bash tools/release.sh publish-github
          "${{ needs.linux.outputs.version }}" "$GITHUB_SHA"
          release "$GITHUB_REPOSITORY"
