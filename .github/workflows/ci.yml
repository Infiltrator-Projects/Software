# SPDX-License-Identifier: GPL-3.0-or-later
name: Verify

on:
  push:
    branches: [main, refactor/updates-controller-0.3.69]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Use the hosted runner until the local runner's checkout can find Git.
  # The local runner currently fails before any source or tests are read.
  group: verify-${{ github.repository }}-${{ github.ref_name }}-${{ startsWith(github.event.head_commit.message, 'Release ') && 'release' || 'development' }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Wire Updates controller on refactor branch
        if: github.ref_name == 'refactor/updates-controller-0.3.69'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path("src/app/main.cpp")
          main = main_path.read_text()
          if '#include "app/updates_controller.hpp"' in main:
              raise SystemExit(0)

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          main = once(
              main,
              '#include "app/ui_components.hpp"\n',
              '#include "app/ui_components.hpp"\n#include "app/updates_controller.hpp"\n',
              "controller include")

          start = main.index("struct UpdatesResult {")
          end = main.index("struct UpdateProcessRun {", start)
          main = main[:start] + main[end:]

          start = main.index("void updates_worker(")
          end = main.index("\ngboolean auto_refresh_updates_idle", start)
          main = main[:start] + '''void updates_worker(
              GTask *task,
              gpointer,
              gpointer task_data,
              GCancellable *)
          {
              auto *data =
                  static_cast<UpdatesRefreshRequest *>(task_data);
              auto *result = new UpdatesRefreshResult{};
              if (data == nullptr) {
                  result->error =
                      "Update task state is unavailable.";
              } else {
                  *result = refresh_updates_data(*data);
              }

              g_task_return_pointer(
                  task,
                  result,
                  [](gpointer pointer) {
                      delete static_cast<UpdatesRefreshResult *>(pointer);
                  });
          }
          ''' + main[end:]

          main = once(
              main,
              "auto *result = static_cast<UpdatesResult *>(\n        g_task_propagate_pointer(G_TASK(async_result), nullptr));",
              "auto *result = static_cast<UpdatesRefreshResult *>(\n        g_task_propagate_pointer(G_TASK(async_result), nullptr));",
              "refresh result type")
          main = once(main, "new UpdatesTaskData{", "new UpdatesRefreshRequest{", "refresh task type")
          main = once(
              main,
              "delete static_cast<UpdatesTaskData *>(pointer);",
              "delete static_cast<UpdatesRefreshRequest *>(pointer);",
              "refresh task deleter")

          start = main.index("void update_plan_worker(")
          end = main.index("\nvoid update_plan_complete", start)
          main = main[:start] + '''void update_plan_worker(
              GTask *task,
              gpointer,
              gpointer task_data,
              GCancellable *)
          {
              auto *data =
                  static_cast<UpdatePlanRequest *>(task_data);
              auto *result = new UpdatePlanResult{};
              if (data == nullptr) {
                  result->error =
                      "No updates are available to plan.";
              } else {
                  *result = plan_updates(*data);
              }

              g_task_return_pointer(
                  task,
                  result,
                  [](gpointer pointer) {
                      delete static_cast<UpdatePlanResult *>(pointer);
                  });
          }
          ''' + main[end:]
          main = once(main, "new UpdatePlanTaskData{}", "new UpdatePlanRequest{}", "plan task type")
          main = once(
              main,
              "delete static_cast<UpdatePlanTaskData *>(pointer);",
              "delete static_cast<UpdatePlanRequest *>(pointer);",
              "plan task deleter")
          main_path.write_text(main)

          cmake_path = Path("CMakeLists.txt")
          cmake = cmake_path.read_text()
          cmake = once(
              cmake,
              "    src/app/installed_inventory.cpp\n    src/app/repository_controller.cpp",
              "    src/app/installed_inventory.cpp\n    src/app/updates_controller.cpp\n    src/app/repository_controller.cpp",
              "CMake controller source")
          cmake_path.write_text(cmake)

          contracts_path = Path("tests/source_contracts.py")
          contracts = contracts_path.read_text()
          contracts = once(
              contracts,
              'installed_inventory = text("src/app/installed_inventory.cpp")\n',
              'installed_inventory = text("src/app/installed_inventory.cpp")\nmain_cpp = text("src/app/main.cpp")\nupdates_controller = text("src/app/updates_controller.cpp")\nupdates_controller_hpp = text("src/app/updates_controller.hpp")\n',
              "contract inputs")
          contracts = once(
              contracts,
              'assert "engine.refresh_installed(result->error)" in app\nassert "engine.refresh(result->error)" in app\n',
              'assert "engine.refresh_installed(result.error)" in updates_controller\nassert "engine.refresh(result.error)" in updates_controller\n',
              "engine ownership contracts")
          anchor = 'assert "struct WindowState final" in window_state\n'
          addition = '''assert "struct WindowState final" in window_state

# Native update reconciliation, external update discovery and update planning
# belong to the Updates controller. main.cpp owns GTK task lifetime and
# presentation, not package-engine orchestration.
assert '"app/updates_controller.hpp"' in main_cpp
assert "src/app/updates_controller.cpp" in cmake
assert "refresh_updates_data" in updates_controller
assert "plan_updates" in updates_controller
assert "engine.list_updates(" in updates_controller
assert "discover_flatpak_updates(" in updates_controller
assert "discover_cinnamon_updates(" in updates_controller
assert "engine.list_updates(" not in main_cpp
assert "discover_flatpak_updates(" not in main_cpp
assert "discover_cinnamon_updates(" not in main_cpp
'''
          contracts = once(contracts, anchor, addition, "controller boundary contracts")
          contracts_path.write_text(contracts)
          PY

          if git diff --quiet; then
            exit 0
          fi
          git diff --check
          python3 tests/source_contracts.py
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add src/app/main.cpp src/app/updates_controller.cpp src/app/updates_controller.hpp CMakeLists.txt tests/source_contracts.py
          git commit -m "Extract update orchestration from app shell"
          git push origin HEAD:refactor/updates-controller-0.3.69

      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq "**Current source version:** $version" README.md
          common_version="$(sed -n 's/.*INFILTRATR_COMMON_EXPECTED_VERSION "\([^"]*\)".*/\1/p' CMakeLists.txt)"
          common_commit="$(sed -n 's/.*INFILTRATR_COMMON_EXPECTED_COMMIT "\([^"]*\)".*/\1/p' CMakeLists.txt)"
          test -n "$common_version"
          test -n "$common_commit"
          test "$(tr -d '[:space:]' < src/infiltratr-common/VERSION)" = "$common_version"
          test "$(git -C src/infiltratr-common rev-parse HEAD)" = "$common_commit"

      - name: Install build dependencies
        if: runner.environment == 'github-hosted'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream build-essential cmake debhelper dpkg-dev dbus-daemon gdb git gpgv libappstream-dev libcurl4-openssl-dev libgtk-3-dev libgtk-4-dev libglib2.0-dev libjson-glib-dev liblzma-dev libsqlite3-dev libxapp-dev pkg-config xvfb zlib1g-dev

      - name: Verify self-hosted build dependencies
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          for command_name in appstreamcli cmake ctest dpkg-buildpackage dpkg-deb dbus-run-session gdb git gpgv pkg-config python3 xvfb-run; do
            command -v "$command_name" >/dev/null 2>&1 || {
              echo "Self-hosted runner is missing $command_name." >&2
              exit 1
            }
          done
          for module in gtk+-3.0 gtk4 glib-2.0 gio-2.0 json-glib-1.0 sqlite3 appstream libcurl liblzma zlib xapp; do
            pkg-config --exists "$module" || {
              echo "Self-hosted runner is missing development module $module." >&2
              exit 1
            }
          done

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify update authorization and source contracts
        run: python3 tests/source_contracts.py

      - name: Engine service smoke test
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 3s dbus-run-session -- ./build/infiltrator-software-engine >engine.out 2>engine.err
          status=$?
          set -e
          cat engine.out || true
          cat engine.err || true
          if [[ "$status" -ne 124 ]]; then
            echo "::error::Engine service exited unexpectedly during D-Bus smoke test (status $status)."
            exit "$status"
          fi

      - name: Launch smoke test
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 20s xvfb-run -a ./build/infiltrator-software >launch.out 2>launch.err
          status=$?
          set -e
          echo "launch exit status: $status"
          cat launch.out || true
          cat launch.err || true
          if grep -Fq "Embedded Discover hero raster failed to decode" launch.err; then
            echo "::error::Embedded Discover raster artwork failed to decode during the graphical smoke test."
            exit 1
          fi
          if [[ "$status" -eq 124 ]]; then
            echo "Software remained alive for the 20 second smoke window with the embedded hero loaded."
            exit 0
          fi
          echo "::error::Software exited unexpectedly during launch smoke test (status $status)."
          echo "Collecting debugger backtrace..."
          timeout 20s xvfb-run -a gdb --batch \
            -ex "set pagination off" \
            -ex run \
            -ex "thread apply all bt full" \
            --args ./build/infiltrator-software || true
          exit "$status"

      - name: Validate AppStream metadata
        run: appstreamcli validate debian/infiltrator-software.metainfo.xml

      - name: Verify Debian package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b
          package="../infiltrator-software_$(tr -d '[:space:]' < VERSION)_amd64.deb"
          test -f "$package"
          test "$(dpkg-deb -f "$package" Package)" = "infiltrator-software"
          dpkg-deb -f "$package" Depends | grep -Eq '(^|, )pkexec([, ]|$)'
          dpkg-deb -f "$package" Depends | grep -Eq '(^|, )gpgv([, ]|$)'
          dpkg-deb -f "$package" Depends | grep -Eq '(^|, )gettext([, ]|$)'
          dpkg-deb -f "$package" Depends | grep -Eq 'libxapp'
          dpkg-deb -f "$package" Provides | grep -Eq '(^|, )mintupdate([, ]|$)'
          if dpkg-deb -f "$package" Conflicts 2>/dev/null | grep -Eq '(^|, )mintupdate([, ]|$)'; then
            echo "::error::Bootstrap release must not Conflict with mintupdate or Software 0.3.49 cannot self-update."
            exit 1
          fi
          dpkg-deb -f "$package" Replaces | grep -Eq '(^|, )mintupdate([, ]|$)'
          dpkg-deb -f "$package" Recommends | grep -Eq '(^|, )flatpak([, ]|$)'
          dpkg-deb --fsys-tarfile "$package" | tar -tf - > package-files.txt
          grep -qx './usr/bin/infiltrator-software' package-files.txt
          grep -qx './usr/bin/infiltrator-software-tray' package-files.txt
          grep -qx './usr/bin/infiltrator-software-session-updater' package-files.txt
          grep -qx './usr/bin/infiltrator-software-cli' package-files.txt
          grep -qx './usr/bin/infiltrator-software-release-upgrade' package-files.txt
          grep -qx './usr/libexec/infiltrator-software-auto-updater' package-files.txt
          grep -qx './usr/lib/systemd/system/infiltrator-software-auto-update.service' package-files.txt
          grep -qx './usr/lib/systemd/system/infiltrator-software-auto-update.timer' package-files.txt
          grep -qx './etc/xdg/autostart/infiltrator-software-session-updater.desktop' package-files.txt
          ./build/infiltrator-software-cli --version | grep -qx "$(tr -d '[:space:]' < VERSION)"
          ./build/infiltrator-software-cli --help | grep -Fq 'upgrade'
          grep -qx './usr/libexec/infiltrator-software-helper' package-files.txt
          grep -qx './usr/libexec/infiltrator-software-update-helper' package-files.txt
          grep -qx './usr/libexec/infiltrator-software-engine' package-files.txt
          grep -qx './usr/share/dbus-1/services/net.ssmith.infiltrator.software.Engine.service' package-files.txt
          grep -qx './usr/share/dbus-1/interfaces/net.ssmith.infiltrator.software.Engine.xml' package-files.txt
          grep -qx './usr/share/polkit-1/actions/net.ssmith.infiltrator.software.policy' package-files.txt
          grep -qx './usr/share/polkit-1/actions/net.ssmith.infiltrator.software.updates.policy' package-files.txt
          grep -qx './etc/xdg/autostart/infiltrator-software-tray.desktop' package-files.txt
          grep -qx './usr/share/icons/hicolor/scalable/status/infiltrator-software-up-to-date-symbolic.svg' package-files.txt
          grep -qx './usr/share/icons/hicolor/scalable/status/infiltrator-software-updates-available-symbolic.svg' package-files.txt
          grep -qx './usr/share/icons/hicolor/scalable/status/infiltrator-software-checking-symbolic.svg' package-files.txt
          grep -qx './usr/share/icons/hicolor/scalable/status/infiltrator-software-installing-symbolic.svg' package-files.txt
          grep -qx './usr/share/icons/hicolor/scalable/status/infiltrator-software-error-symbolic.svg' package-files.txt
          grep -qx './usr/share/applications/net.ssmith.infiltrator.software.desktop' package-files.txt
          grep -qx 'StartupWMClass=net.ssmith.infiltrator.software' debian/net.ssmith.infiltrator.software.desktop
          grep -qx 'Icon=net.ssmith.infiltrator.software' debian/net.ssmith.infiltrator.software.desktop
          grep -Fq 'gtk_window_set_icon_name(GTK_WINDOW(window), "net.ssmith.infiltrator.software")' src/app/*.cpp
          grep -Fq 'gtk_about_dialog_set_logo_icon_name(' src/app/*.cpp
          grep -qx './usr/share/icons/hicolor/scalable/apps/net.ssmith.infiltrator.software.svg' package-files.txt
          grep -qx './usr/share/icons/hicolor/scalable/apps/infiltrator-software.svg' package-files.txt
          grep -qx './usr/share/app-install/icons/infiltrator-software.svg' package-files.txt
          grep -qx './usr/share/metainfo/infiltrator-software.metainfo.xml' package-files.txt
          grep -qx './usr/share/fonts/truetype/infiltrator-software/mb_corpo_a_cond_regular.ttf' package-files.txt
          grep -qx './usr/share/fonts/truetype/infiltrator-software/mb_corpo_s_bold.ttf' package-files.txt
          grep -qx './usr/share/fonts/truetype/infiltrator-software/mb_corpo_s_regular.ttf' package-files.txt
          if grep -Eq '^\./usr/include/infiltratr/|^\./usr/lib/.*/libinfiltratr|/cmake/InfiltratrCommon/' package-files.txt; then
            echo "::error::Software package leaked Common development/runtime payloads."
            cat package-files.txt
            exit 1
          fi
