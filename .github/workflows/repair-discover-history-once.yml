name: Repair Discover History Access

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-discover-history-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Repair exact malformed calls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/discover_view.cpp')
          s = p.read_text()
          bad = 'history_history_controller_loaded(state->history))'
          good = 'history_controller_loaded(history_state->history))'
          n = s.count(bad)
          if n != 3:
              raise SystemExit(f'expected 3 malformed calls, found {n}')
          s = s.replace(bad, good)
          if bad in s or s.count(good) != 3:
              raise SystemExit('history access repair did not converge')
          p.write_text(s)

          c = Path('tests/source_contracts.py')
          t = c.read_text()
          needle = 'assert "history_controller_loaded(" in discover_view_cpp\n'
          guard = 'assert "history_history_controller_loaded" not in discover_view_cpp\n'
          if guard not in t:
              if t.count(needle) != 1:
                  raise SystemExit('contract insertion point changed')
              t = t.replace(needle, needle + guard, 1)
              c.write_text(t)
          PY
      - name: Validate source contracts
        run: python3 tests/source_contracts.py
      - name: Check patch
        run: git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add src/app/discover_view.cpp tests/source_contracts.py
          git commit -m 'Fix Discover history controller access'
          git push origin HEAD:main
