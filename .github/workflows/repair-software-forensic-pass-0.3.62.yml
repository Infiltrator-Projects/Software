name: Repair Software 0.3.62 forensic pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-software-forensic-pass-0.3.62.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair Software 0.3.62 forensic pass'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Narrow the forensic guard and retrigger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/software-forensic-pass-0.3.62.yml')
          text = path.read_text()
          old = "          assert 'icon_well, 42, 42' not in app\n"
          if text.count(old) != 1:
              raise SystemExit('expected broad icon-well assertion exactly once')
          path.write_text(text.replace(old, '', 1))
          PY
          rm .github/workflows/repair-software-forensic-pass-0.3.62.yml
          git diff --check
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git commit -m 'Prepare Software 0.3.62 forensic pass'
          git push origin HEAD:main
