# SPDX-License-Identifier: GPL-3.0-or-later
name: Prepare current shell CI guard correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-ci-guard-fix.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'Prepare current shell CI guard correction'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Materialise corrected CI file outside workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/ci.yml').read_text()
          old = '          assert "#2f67ff" in theme\n'
          new = '          assert \'<< ".nav-row:hover { background: " << surface_hover\' in theme\n'
          if source.count(old) != 1:
              raise SystemExit('stale sidebar colour assertion drifted')
          source = source.replace(old, new, 1)
          Path('.ci-fixed.yml').write_text(source)
          PY
          git diff --check -- .ci-fixed.yml
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add .ci-fixed.yml
          git commit -m 'Materialise corrected current-shell CI contract'
          git push origin HEAD:main
