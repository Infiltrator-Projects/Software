name: Repository process-boundary repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/app-boundary-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route mirror launch through process authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app/repository_view.cpp')
          text = path.read_text()
          pattern = re.compile(
              r'''void repository_mirror_settings_clicked\(\n    GtkButton \*,\n    gpointer user_data\)\n\{.*?\n\}\n\nGtkWidget \*make_repositories_page''',
              re.DOTALL,
          )
          replacement = '''void repository_mirror_settings_clicked(\n    GtkButton *,\n    gpointer user_data)\n{\n    auto *state = static_cast<WindowState *>(user_data);\n    std::string error;\n    GSubprocess *process = start_subprocess(\n        {"pkexec", "mintsources"},\n        G_SUBPROCESS_FLAGS_NONE,\n        error);\n    if (process == nullptr) {\n        if (state != nullptr && state->repositories.status != nullptr) {\n            gtk_label_set_text(\n                GTK_LABEL(state->repositories.status),\n                error.empty()\n                    ? "Linux Mint mirror settings are unavailable."\n                    : error.c_str());\n        }\n        return;\n    }\n\n    /* mintsources owns its own lifetime after successful construction. */\n    g_object_unref(process);\n    if (state != nullptr && state->repositories.status != nullptr) {\n        gtk_label_set_text(\n            GTK_LABEL(state->repositories.status),\n            "Mirror settings opened. Refresh repositories after changing a mirror.");\n    }\n}\n\nGtkWidget *make_repositories_page'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one repository mirror launcher, found {count}')
          if 'g_spawn_' in updated:
              raise SystemExit('repository_view.cpp still contains a direct g_spawn entry point')
          path.write_text(updated)
          PY
          git diff --check
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add src/app/repository_view.cpp
          git commit -m "Route repository mirror launch through process authority"
          git push origin HEAD:main
