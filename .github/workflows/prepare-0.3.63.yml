name: Prepare Software 0.3.63 forensic responsiveness cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-0.3.63.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'Prepare Software 0.3.63 forensic responsiveness cleanup'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: false

      - name: Remove remaining polling and visual iteration residue
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "0.3.62"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Main shell: retire per-page decorative navigation classes and the
          # old 320px CI marker. Current System Settings explicitly requests a
          # 200px search while retaining Common's 180px CSS minimum.
          replace_once(
              "src/app/main.cpp",
              '''GtkWidget *make_nav_row(
              const char *icon_name,
              const char *text,
              const char *subtitle,
              const char *semantic_class,
              GtkWidget **badge_out = nullptr)
          {''',
              '''GtkWidget *make_nav_row(
              const char *icon_name,
              const char *text,
              const char *subtitle,
              GtkWidget **badge_out = nullptr)
          {''')
          replace_once(
              "src/app/main.cpp",
              '''    if (semantic_class != nullptr) {
                  gtk_widget_add_css_class(
                      row, semantic_class);
              }
          ''',
              '''''')
          replace_once(
              "src/app/main.cpp",
              '''    static constexpr const char *semantic_classes[] = {
                  "nav-discover", "nav-installed", "nav-updates", "nav-system",
                  "nav-repositories", "nav-history", "nav-repair"
              };
          
          ''',
              '''''')
          replace_once(
              "src/app/main.cpp",
              '''                subtitles[index],
                          semantic_classes[index],
                          badge));''',
              '''                subtitles[index],
                          badge));''')
          replace_once(
              "src/app/main.cpp",
              '''        state->global_search, 180, -1 /* legacy CI marker: state->global_search, 320, -1 */);''',
              '''        state->global_search, 200, -1);''')

          # Common-aligned shell semantics: navigation and page identity are
          # neutral. Success/warning/fault colours remain reserved for states.
          replace_once(
              "src/app/theme.cpp",
              '''        << ".nav-row image { opacity: 1; }"
                  << ".nav-discover image { color: #55a8ff; }"
                  << ".nav-installed image { color: #55e58b; }"
                  << ".nav-updates image { color: #ffb746; }"
                  << ".nav-system image { color: #37c7ff; }"
                  << ".nav-repositories image { color: #50e58a; }"
                  << ".nav-history image { color: #45a8ff; }"
                  << ".nav-repair image { color: #ff6572; }"
                  << ".nav-row:selected image { color: " << accent_fg << "; }"
                  << ".nav-badge { min-width: 24px; min-height: 24px; padding: 0 7px; "
                  << "border-radius: 999px; background: #ff4758; color: #ffffff; "
                  << "font-size: 10px; font-weight: " << typography->ui_bold_weight
                  << "; box-shadow: 0 3px 8px rgba(120,0,18,0.35); }"
                  << "button.sidebar-settings { margin-top: 8px; padding: 10px 12px; "
                  << "background: " << card << "; border: 1px solid " << border
                  << "; border-radius: 12px; box-shadow: none; }"
                  << "button.sidebar-settings:hover { background: " << card_hover
                  << "; border-color: " << info << "; }"
                  << ".settings-icon-well { min-width: 42px; min-height: 42px; "
                  << "background: transparent; border-radius: 10px; }"
                  << ".settings-icon-well image { color: " << heading << "; }"''',
              '''        << ".nav-row image { opacity: 1; color: " << neutral << "; }"
                  << ".nav-row:selected image { color: " << accent_fg << "; }"
                  << ".nav-badge { min-width: 24px; min-height: 24px; padding: 0 7px; "
                  << "border-radius: 999px; background: " << fault << "; color: "
                  << accent_fg << "; font-size: 10px; font-weight: "
                  << typography->ui_bold_weight << "; box-shadow: none; }"
                  << "button.sidebar-settings { margin-top: 8px; padding: 10px 12px; "
                  << "background: " << card << "; border: 1px solid " << border
                  << "; border-radius: 12px; box-shadow: none; }"
                  << "button.sidebar-settings:hover { background: " << card_hover
                  << "; border-color: " << neutral << "; }"
                  << ".settings-icon-well { min-width: 42px; min-height: 42px; "
                  << "background: transparent; border-radius: 10px; }"
                  << ".settings-icon-well image { color: " << neutral << "; }"''')
          replace_once(
              "src/app/theme.cpp",
              '''        << ".page-scroller scrollbar slider { min-width: 8px; border-radius: 999px; "
                  << "background: " << info << "; }"
                  << ".page-scroller scrollbar trough { background: " << panel << "; }"''',
              '''        << ".page-scroller scrollbar slider { min-width: 8px; border-radius: 999px; "
                  << "background: " << detail_label << "; }"
                  << ".page-scroller scrollbar slider:hover { background: " << neutral << "; }"
                  << ".page-scroller scrollbar trough { background: transparent; }"''')
          replace_once(
              "src/app/theme.cpp",
              '''        // Legacy CI text marker only; the .hero-ribbon-a widget/style was retired in 0.3.62.
                  << ".page-discover .page-icon, .page-discover .page-icon image, "
                  << ".page-discover .hero-title { color: " << info << "; border-color: " << info << "; }"
                  << ".page-installed .page-icon, .page-installed .page-icon image, "
                  << ".page-installed .hero-title { color: " << success << "; border-color: " << success_border << "; }"
                  << ".page-updates .page-icon, .page-updates .page-icon image, "
                  << ".page-updates .hero-title { color: " << warning << "; border-color: " << warning_border << "; }"
                  << ".page-system .page-icon, .page-system .page-icon image, "
                  << ".page-system .hero-title { color: " << heading << "; border-color: " << status_border << "; }"
                  << ".page-repositories .page-icon, .page-repositories .page-icon image, "
                  << ".page-repositories .hero-title { color: " << info << "; border-color: " << info << "; }"
                  << ".page-history .page-icon, .page-history .page-icon image, "
                  << ".page-history .hero-title { color: " << info << "; border-color: " << info << "; }"
                  << ".page-repair .page-icon, .page-repair .page-icon image, "
                  << ".page-repair .hero-title { color: " << fault << "; border-color: " << fault << "; }"
          
          ''',
              '''''')
          replace_once(
              "src/app/theme.cpp",
              '''        << ".card-info { border-color: " << info << "; }"
                  << ".page-discover .card { border-color: " << info << "; }"
                  << ".page-updates .card { border-color: " << warning_border << "; }"
                  << ".page-system .card { border-color: " << status_border << "; }"
                  << ".page-repositories .card { border-color: " << operation << "; }"
                  << ".page-history .card { border-color: " << info << "; }"
                  << ".page-repair .card { border-color: " << fault << "; }"''',
              '''        << ".card-info { border-color: " << info << "; }"''')

          # Tray: retain the 2-second executable-replacement watch, but stop
          # opening/parsing preference and override files and repainting XApp
          # on every tick. File stamps make those reads change-driven.
          p = Path("src/tray/main.cpp")
          text = p.read_text()
          text = text.replace(
              '#include <ctime>\n#include <filesystem>',
              '#include <ctime>\n#include <cstdint>\n#include <filesystem>', 1)
          text = text.replace(
              'using infiltrator::software::load_software_preferences;\n',
              'using infiltrator::software::load_software_preferences;\nusing infiltrator::software::software_preferences_path;\n', 1)
          text = text.replace(
              '''struct TrayState {''',
              '''struct FileStamp {
              bool exists{false};
              std::uintmax_t size{0U};
              std::filesystem::file_time_type modified{};
          };
          
          bool operator==(const FileStamp &left, const FileStamp &right) noexcept
          {
              return left.exists == right.exists &&
                     left.size == right.size &&
                     left.modified == right.modified;
          }
          
          struct TrayState {''', 1)
          text = text.replace(
              '''    SoftwarePreferences preferences{};
              gint64 started_us{0};''',
              '''    SoftwarePreferences preferences{};
              std::string override_state;
              FileStamp preferences_stamp{};
              FileStamp override_stamp{};
              bool runtime_inputs_initialized{false};
              gint64 started_us{0};''', 1)

          read_override_end = '''    return value;
          }
          
          std::int64_t last_successful_update()'''
          runtime_helpers = '''    return value;
          }
          
          FileStamp file_stamp(const std::filesystem::path &path)
          {
              FileStamp stamp;
              if (path.empty()) {
                  return stamp;
              }
              std::error_code ec;
              stamp.exists = std::filesystem::exists(path, ec) && !ec;
              if (!stamp.exists) {
                  return stamp;
              }
              if (std::filesystem::is_regular_file(path, ec) && !ec) {
                  stamp.size = std::filesystem::file_size(path, ec);
                  if (ec) stamp.size = 0U;
              }
              ec.clear();
              stamp.modified = std::filesystem::last_write_time(path, ec);
              if (ec) stamp.modified = {};
              return stamp;
          }
          
          bool refresh_runtime_inputs(TrayState *state, const bool force = false)
          {
              if (state == nullptr) {
                  return false;
              }
          
              bool changed = false;
              const std::filesystem::path preferences_path =
                  software_preferences_path();
              const FileStamp preferences_now = file_stamp(preferences_path);
              if (force || !state->runtime_inputs_initialized ||
                  !(preferences_now == state->preferences_stamp)) {
                  SoftwarePreferences preferences;
                  std::string error;
                  if (load_software_preferences(preferences, error)) {
                      state->preferences = std::move(preferences);
                  } else if (!error.empty()) {
                      g_debug("Unable to reload Software preferences: %s", error.c_str());
                  }
                  state->preferences_stamp = preferences_now;
                  changed = true;
              }
          
              const std::filesystem::path override_path = state_file();
              const FileStamp override_now = file_stamp(override_path);
              if (force || !state->runtime_inputs_initialized ||
                  !(override_now == state->override_stamp)) {
                  state->override_state = read_override();
                  state->override_stamp = override_now;
                  changed = true;
              }
          
              state->runtime_inputs_initialized = true;
              return changed;
          }
          
          std::int64_t last_successful_update()'''
          if text.count(read_override_end) != 1:
              raise SystemExit("tray: read_override insertion anchor mismatch")
          text = text.replace(read_override_end, runtime_helpers, 1)

          old_render = '''    std::string preference_error;
              SoftwarePreferences preferences;
              if (load_software_preferences(
                      preferences,
                      preference_error)) {
                  state->preferences = std::move(preferences);
              }
          
              const std::string override = read_override();
          '''
          new_render = '''    const std::string &override = state->override_state;
          '''
          if text.count(old_render) != 1:
              raise SystemExit("tray: render I/O block mismatch")
          text = text.replace(old_render, new_render, 1)

          text = text.replace(
              '''    if (!read_override().empty()) {
                  render(state);
                  return;
              }
          ''',
              '''    (void)refresh_runtime_inputs(state);
              if (!state->override_state.empty()) {
                  render(state);
                  return;
              }
          ''', 1)

          scheduled_load = '''    std::string preference_error;
              SoftwarePreferences preferences;
              if (load_software_preferences(
                      preferences,
                      preference_error)) {
                  state->preferences = std::move(preferences);
              }
          
          '''
          if text.count(scheduled_load) != 1:
              raise SystemExit(f"tray: scheduled preference block count {text.count(scheduled_load)}")
          text = text.replace(scheduled_load, '''    (void)refresh_runtime_inputs(state);
          
          ''', 1)

          text = text.replace(
              '''gboolean state_tick(gpointer user_data)
          {
              auto *state = static_cast<TrayState *>(user_data);
              if (state != nullptr &&
                  !state->replacement_exec_failed &&
                  installed_tray_replaced()) {''',
              '''gboolean state_tick(gpointer user_data)
          {
              auto *state = static_cast<TrayState *>(user_data);
              if (state == nullptr) {
                  return G_SOURCE_CONTINUE;
              }
              const bool runtime_changed = refresh_runtime_inputs(state);
              if (!state->replacement_exec_failed &&
                  installed_tray_replaced()) {''', 1)
          text = text.replace(
              '''    render(state);
              return G_SOURCE_CONTINUE;
          }
          
          gboolean clear_opening_software''',
              '''    if (runtime_changed) {
                  render(state);
              }
              return G_SOURCE_CONTINUE;
          }
          
          gboolean clear_opening_software''', 1)

          startup_load = '''    std::string preference_error;
              (void)load_software_preferences(
                  state.preferences,
                  preference_error);
              state.icon ='''
          if text.count(startup_load) != 1:
              raise SystemExit("tray: startup preference block mismatch")
          text = text.replace(
              startup_load,
              '''    (void)refresh_runtime_inputs(&state, true);
              state.icon =''', 1)
          p.write_text(text)

          # Release metadata.
          Path("VERSION").write_text("0.3.63\n")
          readme = Path("README.md").read_text()
          readme = readme.replace(
              "**Current source version:** 0.3.62",
              "**Current source version:** 0.3.63", 1)
          Path("README.md").write_text(readme)

          changelog = Path("debian/changelog").read_text()
          entry = '''infiltrator-software (0.3.63) unstable; urgency=high
          
            * Stop the resident tray from re-reading preferences/runtime state and
              repainting its XApp icon every two seconds when nothing changed; retain
              the lightweight executable-replacement watch with change-driven inputs.
            * Remove remaining titlebar CI-marker and page/navigation colour residue,
              matching System Settings 0.4.52 search geometry and Common-neutral shell
              semantics while reserving warning/success/fault colours for real states.
            * Re-verify the exact current Common 1.19.38 pin at
              7070c5812b50821fd7580101cb2289a3184f6b2c.
          
           -- Shannon Smith <infiltratr@yandex.com>  Sat, 03 Oct 2026 13:20:00 +1000
          
          '''
          Path("debian/changelog").write_text(entry + changelog)

          meta = Path("debian/infiltrator-software.metainfo.xml").read_text()
          anchor = "  <releases>\n"
          if meta.count(anchor) != 1:
              raise SystemExit("metainfo releases anchor mismatch")
          release = '''    <release version="0.3.63" date="2026-10-03">
                <description>
                  <p>Eliminates redundant tray polling I/O and final decorative shell residue while aligning Software with System Settings 0.4.52 and Common 1.19.38.</p>
                </description>
              </release>
          '''
          meta = meta.replace(anchor, anchor + release, 1)
          Path("debian/infiltrator-software.metainfo.xml").write_text(meta)
          PY

          rm .github/workflows/prepare-0.3.63.yml

          # Contract checks for this tranche.
          grep -Fq 'state->global_search, 200, -1);' src/app/main.cpp
          ! grep -Fq 'legacy CI marker' src/app/main.cpp
          ! grep -Fq 'nav-discover' src/app/main.cpp
          ! grep -Fq '.nav-discover image' src/app/theme.cpp
          ! grep -Fq '.page-updates .card' src/app/theme.cpp
          grep -Fq 'refresh_runtime_inputs(state)' src/tray/main.cpp
          grep -Fq 'if (runtime_changed)' src/tray/main.cpp
          ! grep -Fq 'const std::string override = read_override();' src/tray/main.cpp
          grep -Fq 'INFILTRATR_COMMON_EXPECTED_VERSION "1.19.38"' CMakeLists.txt
          grep -Fq 'INFILTRATR_COMMON_EXPECTED_COMMIT "7070c5812b50821fd7580101cb2289a3184f6b2c"' CMakeLists.txt
          test "$(dpkg-parsechangelog -S Version)" = "0.3.63"
          appstreamcli validate debian/infiltrator-software.metainfo.xml
          git diff --check

          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git commit -m 'Prepare 0.3.63 tray and shell responsiveness cleanup'
          git push origin HEAD:main
