# SPDX-License-Identifier: GPL-3.0-or-later
name: Run final Software 0.3.62 forensic source pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/software-forensic-pass-0.3.62-v4.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'Run final Software 0.3.62 forensic source pass'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream build-essential cmake git libappstream-dev libcurl4-openssl-dev libgtk-3-dev libgtk-4-dev libglib2.0-dev libjson-glib-dev liblzma-dev libsqlite3-dev libxapp-dev pkg-config zlib1g-dev

      - name: Apply exact v3 transform without brittle broad assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(tr -d '[:space:]' < VERSION)" = "0.3.61"
          git -C src/infiltratr-common fetch --depth=1 origin 7070c5812b50821fd7580101cb2289a3184f6b2c
          git -C src/infiltratr-common checkout --detach 7070c5812b50821fd7580101cb2289a3184f6b2c
          test "$(tr -d '[:space:]' < src/infiltratr-common/VERSION)" = "1.19.38"

          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/software-forensic-pass-0.3.62-v3.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 - <<'PY'")
          end = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(source[start + 1:end])) + '\n'
          marker = "theme = Path('src/app/theme.cpp').read_text()\n"
          if marker not in script:
              raise SystemExit('v3 sanity-block marker not found')
          script = script.split(marker, 1)[0]
          Path('/tmp/software-0.3.62-transform.py').write_text(script)
          PY
          python3 /tmp/software-0.3.62-transform.py

          git diff --check
          test "$(tr -d '[:space:]' < VERSION)" = "0.3.62"
          test "$(tr -d '[:space:]' < src/infiltratr-common/VERSION)" = "1.19.38"
          test "$(git -C src/infiltratr-common rev-parse HEAD)" = "7070c5812b50821fd7580101cb2289a3184f6b2c"

      - name: Configure, build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          appstreamcli validate debian/infiltrator-software.metainfo.xml

      - name: Commit tested 0.3.62 source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add CMakeLists.txt README.md VERSION src/infiltratr-common src/app/theme.hpp src/app/theme.cpp src/app/ui_components.cpp src/app/main.cpp debian/changelog debian/infiltrator-software.metainfo.xml
          git commit -m 'Prepare Software 0.3.62 forensic responsiveness release'
          git push origin HEAD:main
