name: Repair bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  correct-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct runner source and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/forensic-repair.yml')
          lines = path.read_text().splitlines()
          needle = 'assert cinnamon_native.count("configure_https_only(curl);")'
          matches = [i for i, line in enumerate(lines) if needle in line]
          if len(matches) != 1:
              raise SystemExit(f'expected one malformed assertion line, found {len(matches)}')
          index = matches[0]
          if index + 1 >= len(lines) or 'cinnamon_native.count("curl_easy_perform(curl)")' not in lines[index + 1]:
              raise SystemExit('malformed assertion continuation was not adjacent')
          prefix = lines[index][:lines[index].index('assert')]
          lines[index:index + 2] = [
              prefix + 'assert cinnamon_native.count("configure_https_only(curl);") == cinnamon_native.count("curl_easy_perform(curl)")'
          ]
          path.write_text('\n'.join(lines) + '\n')
          PY
          git rm .github/workflows/repair-bootstrap.yml
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add -A
          git commit -m "Correct one-shot repair runner"
          git push origin HEAD:main
