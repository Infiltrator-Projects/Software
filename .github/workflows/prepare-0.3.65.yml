name: Prepare Software 0.3.65 lazy-page forensic pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-0.3.65.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'Prepare Software 0.3.65 lazy-page forensic pass'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: false

      - name: Apply audited lazy-page and shell-lifecycle cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/main.cpp')
          text = path.read_text()

          marker = '''gboolean periodic_updates_refresh(gpointer user_data)
          {
              auto *state = static_cast<WindowState *>(user_data);
              if (state == nullptr || state->stack == nullptr ||
                  !state->updates_loaded || state->updates_busy) {
                  return G_SOURCE_CONTINUE;
              }

              const char *visible =
                  gtk_stack_get_visible_child_name(state->stack);
              if (visible == nullptr || std::strcmp(visible, "updates") != 0) {
                  return G_SOURCE_CONTINUE;
              }

              if (update_metadata_refresh_due(
                      g_get_monotonic_time(),
                      state->updates_last_metadata_refresh_us,
                      state->updates_busy)) {
                  refresh_updates_internal(state, true, false);
              }
              return G_SOURCE_CONTINUE;
          }

          '''
          if marker not in text:
              raise SystemExit('periodic refresh marker missing')

          helpers = marker + '''void stop_updates_refresh_timer(WindowState *state)
          {
              if (state == nullptr || state->updates_refresh_timer_id == 0U) {
                  return;
              }
              g_source_remove(state->updates_refresh_timer_id);
              state->updates_refresh_timer_id = 0U;
          }

          void start_updates_refresh_timer(WindowState *state)
          {
              if (state == nullptr || state->updates_refresh_timer_id != 0U) {
                  return;
              }
              state->updates_refresh_timer_id =
                  g_timeout_add_seconds(60U, periodic_updates_refresh, state);
          }

          bool ensure_page_constructed(WindowState *state, const int index)
          {
              if (state == nullptr || state->stack == nullptr ||
                  index < 0 || index >= 7) {
                  return false;
              }

              static constexpr const char *page_names[] = {
                  "discover", "installed", "updates", "system",
                  "repositories", "history", "repair"
              };
              if (gtk_stack_get_child_by_name(
                      state->stack, page_names[index]) != nullptr) {
                  return true;
              }

              GtkWidget *page = nullptr;
              switch (index) {
              case 0:
                  page = make_discover_page(state);
                  break;
              case 1:
                  page = create_installed_page(
                      &state->installed, state->window);
                  break;
              case 2:
                  page = make_updates_page(state);
                  break;
              case 3:
                  page = make_system_page(state);
                  break;
              case 4:
                  page = make_repositories_page(state);
                  break;
              case 5:
                  page = create_history_controller_page(
                      &state->history,
                      state->window,
                      history_controller_changed,
                      state);
                  break;
              case 6:
                  page = make_repair_page(state);
                  break;
              default:
                  break;
              }
              if (page == nullptr) {
                  return false;
              }

              gtk_stack_add_named(
                  state->stack, page, page_names[index]);
              return true;
          }

          '''
          text = text.replace(marker, helpers, 1)

          old_nav = '''    auto *state = static_cast<WindowState *>(user_data);
              gtk_stack_set_visible_child_name(state->stack, page_names[index]);

              /*
          '''
          new_nav = '''    auto *state = static_cast<WindowState *>(user_data);
              if (!ensure_page_constructed(state, index)) {
                  return;
              }
              if (index == 2) {
                  start_updates_refresh_timer(state);
              } else {
                  stop_updates_refresh_timer(state);
              }
              gtk_stack_set_visible_child_name(state->stack, page_names[index]);

              /*
          '''
          if old_nav not in text:
              raise SystemExit('navigation marker missing')
          text = text.replace(old_nav, new_nav, 1)

          old_timer = '''    /*
               * Keep the Updates page current while it remains open.  This timer does
               * not block the UI and only starts an unprivileged metadata refresh when
               * the last successful refresh is stale.
               */
              state->updates_refresh_timer_id =
                  g_timeout_add_seconds(
                      60U, periodic_updates_refresh, state);

          '''
          if old_timer not in text:
              raise SystemExit('startup timer block missing')
          text = text.replace(old_timer, '', 1)

          old_transition = '''    /*
               * Navigation is a state change, not a long-running visual operation.
               * A crossfade keeps both pages mapped while the destination page starts
               * its lazy catalogue work; if that work delays a frame, GTK can leave a
               * half-faded source page visible for seconds.  Switch pages atomically so
               * the user always sees exactly one page.
               */
              gtk_stack_set_transition_type(
                  state->stack, GTK_STACK_TRANSITION_TYPE_NONE);
          '''
          new_transition = '''    /*
               * Page trees are now constructed before they become visible and their
               * expensive refresh work starts only from the subsequent idle callback.
               * That makes the InfiltratorOS 110 ms shell crossfade safe again without
               * allowing backend work to hold a half-painted transition on screen.
               */
              gtk_stack_set_transition_type(
                  state->stack, GTK_STACK_TRANSITION_TYPE_CROSSFADE);
              gtk_stack_set_transition_duration(state->stack, 110U);
          '''
          if old_transition not in text:
              raise SystemExit('stack transition block missing')
          text = text.replace(old_transition, new_transition, 1)

          old_pages = '''    gtk_stack_add_named(
                  state->stack,
                  make_discover_page(state),
                  "discover");
              gtk_stack_add_named(
                  state->stack,
                  create_installed_page(
                      &state->installed,
                      GTK_WINDOW(window)),
                  "installed");
              gtk_stack_add_named(
                  state->stack,
                  make_updates_page(state),
                  "updates");
              gtk_stack_add_named(
                  state->stack,
                  make_system_page(state),
                  "system");
              gtk_stack_add_named(
                  state->stack,
                  make_repositories_page(state),
                  "repositories");
              gtk_stack_add_named(
                  state->stack,
                  create_history_controller_page(
                      &state->history,
                      GTK_WINDOW(window),
                      history_controller_changed,
                      state),
                  "history");
              gtk_stack_add_named(
                  state->stack,
                  make_repair_page(state),
                  "repair");

              const int initial_page = open_updates ? 2 : 0;
              gtk_stack_set_visible_child_name(
                  state->stack,
                  initial_page == 2 ? "updates" : "discover");
              select_page(state, initial_page);
          '''
          new_pages = '''    /*
               * First paint owns only Discover.  Every other page is constructed on
               * first navigation, matching the lazy-module lifecycle used by current
               * InfiltratorOS System Settings.  This removes six inactive GTK widget
               * trees from Software startup without changing their refresh semantics.
               */
              gtk_stack_add_named(
                  state->stack,
                  make_discover_page(state),
                  "discover");

              const int initial_page = open_updates ? 2 : 0;
              select_page(state, initial_page);
          '''
          if old_pages not in text:
              raise SystemExit('eager page-construction block missing')
          text = text.replace(old_pages, new_pages, 1)

          path.write_text(text)

          version = Path('VERSION')
          if version.read_text().strip() != '0.3.64':
              raise SystemExit('unexpected VERSION')
          version.write_text('0.3.65\n')

          readme = Path('README.md')
          r = readme.read_text()
          old = '**Current source version:** 0.3.64'
          if old not in r:
              raise SystemExit('README version anchor missing')
          r = r.replace(old, '**Current source version:** 0.3.65', 1)
          readme.write_text(r)

          changelog = Path('debian/changelog')
          c = changelog.read_text()
          entry = '''infiltrator-software (0.3.65) unstable; urgency=high

            * Construct Installed, Updates, System, Repositories, History and Repair
              only on first navigation instead of building six inactive GTK page trees
              before the initial Software window can paint.
            * Scope the Updates freshness timer to the visible Updates page instead of
              installing a lifetime wake-up source on every Software launch.
            * Restore the current InfiltratorOS 110 ms page crossfade now that page
              construction precedes visibility and backend refresh starts from idle.
            * Re-verify the suite-current Common 1.19.38 pin at
              7070c5812b50821fd7580101cb2289a3184f6b2c against System Settings 0.4.54.

           -- Shannon Smith <infiltratr@yandex.com>  Sat, 03 Oct 2026 14:55:00 +1000

          '''
          changelog.write_text(entry + c)

          meta = Path('debian/infiltrator-software.metainfo.xml')
          m = meta.read_text()
          anchor = '  <releases>\n'
          if anchor not in m:
              raise SystemExit('AppStream releases anchor missing')
          release = '''    <release version="0.3.65" date="2026-10-03">
                <description>
                  <p>Lazily constructs inactive pages, scopes update refresh timing to the Updates page and aligns page transitions with the current InfiltratorOS shell cadence.</p>
                </description>
              </release>
          '''
          m = m.replace(anchor, anchor + release, 1)
          meta.write_text(m)

          Path('.github/workflows/prepare-0.3.65.yml').unlink()
          PY

          git diff --check
          test "$(tr -d '[:space:]' < VERSION)" = "0.3.65"
          grep -q 'release version="0.3.65"' debian/infiltrator-software.metainfo.xml

          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git commit -m 'Prepare Software 0.3.65 lazy-page release'
          git push origin HEAD:main
