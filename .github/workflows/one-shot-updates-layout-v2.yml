# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot Updates layout correction v2

on:
  push:
    branches: [fix/updates-layout-0.3.67]

permissions:
  contents: write

concurrency:
  group: updates-layout-0.3.67
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[layout-fix-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out branch and Common
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply corrected Updates layout patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/one-shot-updates-layout.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          source = workflow[start:end]
          lines = source.splitlines()
          source = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines
              if '.page-updates .card-info { padding: 10px 12px; }' not in line
          ) + "\n"
          compile(source, '<updates-layout-patch>', 'exec')
          exec(source, {'__name__': '__main__'})
          PY

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream build-essential cmake debhelper dpkg-dev dbus-daemon gdb git gpgv libappstream-dev libcurl4-openssl-dev libgtk-3-dev libgtk-4-dev libglib2.0-dev libjson-glib-dev liblzma-dev libsqlite3-dev libxapp-dev pkg-config xvfb zlib1g-dev

      - name: Configure, build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          python3 tests/source_contracts.py
          appstreamcli validate debian/infiltrator-software.metainfo.xml

      - name: Graphical launch smoke test
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 12s xvfb-run -a ./build/infiltrator-software --updates >launch.out 2>launch.err
          status=$?
          set -e
          cat launch.out || true
          cat launch.err || true
          if [[ "$status" -ne 124 ]]; then
            echo "Software exited unexpectedly during Updates launch smoke test: $status" >&2
            exit "$status"
          fi

      - name: Commit tested layout correction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-updates-layout.yml
          rm .github/workflows/one-shot-updates-layout-v2.yml
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add src/app/main.cpp src/app/theme.cpp tests/source_contracts.py VERSION README.md debian/changelog debian/infiltrator-software.metainfo.xml .github/workflows/one-shot-updates-layout.yml .github/workflows/one-shot-updates-layout-v2.yml
          git diff --cached --check
          git commit -m "Release 0.3.67: restore compact Updates layout [layout-fix-applied]"
          git push origin HEAD:fix/updates-layout-0.3.67
