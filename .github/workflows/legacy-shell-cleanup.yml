# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot page view split

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/legacy-shell-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Split Discover and Updates implementation ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          legacy_path = Path('src/app/legacy_page_impl.cpp')
          source = legacy_path.read_text()

          hero_marker = '\nstatic constexpr const char kDiscoverHeroBase64[] ='
          updates_state_marker = '\nstruct UpdateProcessRun {\n'
          discover_ops_marker = '\nstruct DiscoverFlatpakOperation {\n'
          updates_view_marker = '\nvoid set_update_runtime_state(const std::string_view value)\n'
          namespace_marker = '\n} // namespace infiltrator::software::app\n'

          positions = {
              'hero': source.find(hero_marker),
              'updates_state': source.find(updates_state_marker),
              'discover_ops': source.find(discover_ops_marker),
              'updates_view': source.find(updates_view_marker),
              'namespace': source.rfind(namespace_marker),
          }
          if any(value < 0 for value in positions.values()):
              raise SystemExit(f'Unable to identify page split boundaries: {positions}')
          if not (
              positions['hero'] < positions['updates_state'] <
              positions['discover_ops'] < positions['updates_view'] <
              positions['namespace']
          ):
              raise SystemExit(f'Page split boundaries are out of order: {positions}')

          preamble = source[:positions['hero']]
          discover_primary = source[positions['hero']:positions['updates_state']]
          updates_shared = source[positions['updates_state']:positions['discover_ops']]
          discover_operations = source[positions['discover_ops']:positions['updates_view']]
          updates_primary = source[positions['updates_view']:positions['namespace']]
          namespace_close = source[positions['namespace']:]

          discover_preamble = preamble.replace(
              '// SPDX-License-Identifier: GPL-3.0-or-later\n',
              '// SPDX-License-Identifier: GPL-3.0-or-later\n#include "app/discover_view.hpp"\n',
              1,
          )
          discover_preamble += '''\nvoid record_transaction_history(\n    const TransactionPlan &plan,\n    bool success,\n    std::string_view message);\n'''
          discover_source = (
              discover_preamble +
              discover_primary +
              discover_operations +
              namespace_close
          )

          updates_preamble = preamble.replace(
              '// SPDX-License-Identifier: GPL-3.0-or-later\n',
              '// SPDX-License-Identifier: GPL-3.0-or-later\n#include "app/updates_view.hpp"\n#include "app/discover_view.hpp"\n',
              1,
          )
          updates_preamble += '''\nstd::string display_size(std::uint64_t bytes);\nvoid package_record_destroy(gpointer data);\nGtkWidget *detail_row(const char *caption, const std::string &value);\n'''
          updates_source = (
              updates_preamble +
              updates_shared +
              updates_primary +
              namespace_close
          )

          for name, text in (
              ('Discover', discover_source),
              ('Updates', updates_source),
          ):
              if 'namespace infiltrator::software::app {' not in text:
                  raise SystemExit(f'{name} view lost namespace declaration.')
              if text.count('} // namespace infiltrator::software::app') != 1:
                  raise SystemExit(f'{name} view has malformed namespace closure.')

          Path('src/app/discover_view.cpp').write_text(discover_source)
          Path('src/app/updates_view.cpp').write_text(updates_source)
          legacy_path.unlink()

          cmake_path = Path('CMakeLists.txt')
          cmake = cmake_path.read_text()
          old = '    src/app/legacy_page_impl.cpp\n'
          new = '    src/app/discover_view.cpp\n    src/app/updates_view.cpp\n'
          if old not in cmake:
              raise SystemExit('Legacy page source is not present in the app target.')
          cmake_path.write_text(cmake.replace(old, new, 1))

          contracts_path = Path('tests/source_contracts.py')
          contracts = contracts_path.read_text()
          old_assignment = 'legacy_page_impl = text("src/app/legacy_page_impl.cpp")\n'
          new_assignment = (
              'discover_view_cpp = text("src/app/discover_view.cpp")\n'
              'updates_view_cpp = text("src/app/updates_view.cpp")\n'
              'page_views = discover_view_cpp + "\\n" + updates_view_cpp\n'
          )
          if old_assignment not in contracts:
              raise SystemExit('Legacy source-contract assignment was not found.')
          contracts = contracts.replace(old_assignment, new_assignment, 1)
          contracts = contracts.replace('legacy_page_impl', 'page_views')
          contracts = contracts.replace(
              'assert "refresh_updates_data" in page_views',
              'assert "refresh_updates_data" in updates_view_cpp',
              1,
          )
          anchor = 'assert not Path("src/app/legacy_page_aliases.hpp").exists()\n'
          addition = (
              'assert not Path("src/app/legacy_page_impl.cpp").exists()\n'
              'assert "src/app/discover_view.cpp" in cmake\n'
              'assert "src/app/updates_view.cpp" in cmake\n'
              'assert "src/app/legacy_page_impl.cpp" not in cmake\n'
          )
          if anchor not in contracts:
              raise SystemExit('Source-contract split anchor not found.')
          contracts = contracts.replace(anchor, anchor + addition, 1)
          contracts = contracts.replace(
              '# belong to the Updates controller. The quarantined legacy page provider still\n# owns GTK task lifetime/presentation until that lifecycle is extracted.\n',
              '# belong to the Updates controller. The Updates view owns GTK task lifetime\n# and presentation while reconciliation and planning remain controller-owned.\n',
              1,
          )
          contracts_path.write_text(contracts)
          PY

          git diff --check
          ! test -e src/app/legacy_page_impl.cpp
          test -s src/app/discover_view.cpp
          test -s src/app/updates_view.cpp
          grep -Fq 'make_discover_page' src/app/discover_view.cpp
          grep -Fq 'make_updates_page' src/app/updates_view.cpp
          ! grep -Fq 'make_updates_page' src/app/discover_view.cpp
          ! grep -Fq 'make_discover_page' src/app/updates_view.cpp

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream build-essential cmake debhelper dpkg-dev dbus-daemon gdb git gpgv libappstream-dev libcurl4-openssl-dev libgtk-3-dev libgtk-4-dev libglib2.0-dev libjson-glib-dev liblzma-dev libsqlite3-dev libxapp-dev pkg-config xvfb zlib1g-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify source contracts
        run: python3 tests/source_contracts.py

      - name: Graphical smoke test
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 20s xvfb-run -a ./build/infiltrator-software >launch.out 2>launch.err
          status=$?
          set -e
          cat launch.out || true
          cat launch.err || true
          test "$status" -eq 124

      - name: Commit split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add src/app/discover_view.cpp src/app/updates_view.cpp src/app/legacy_page_impl.cpp CMakeLists.txt tests/source_contracts.py
          git diff --cached --check
          git commit -m "Split Discover and Updates view implementations"
          git push origin HEAD:main
