# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot legacy alias cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/legacy-shell-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Replace legacy state aliases with explicit ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          alias_path = Path('src/app/legacy_page_aliases.hpp')
          legacy_path = Path('src/app/legacy_page_impl.cpp')
          aliases = alias_path.read_text()
          legacy = legacy_path.read_text()

          mapping = {}
          for line in aliases.splitlines():
              match = re.fullmatch(r'#define\s+([A-Za-z_][A-Za-z0-9_]*)\s+(.+)', line)
              if match:
                  mapping[match.group(1)] = match.group(2).strip()
          if len(mapping) < 40:
              raise SystemExit(f'Unexpectedly small legacy alias map: {len(mapping)}')

          names = sorted(mapping, key=len, reverse=True)
          pointer_pattern = re.compile(r'->(' + '|'.join(map(re.escape, names)) + r')\b')
          matches = pointer_pattern.findall(legacy)
          if not matches:
              raise SystemExit('No legacy pointer aliases were found to migrate.')

          legacy = pointer_pattern.sub(
              lambda match: '->' + mapping[match.group(1)],
              legacy,
          )

          remaining_pointer_aliases = [
              name for name in names
              if re.search(r'->' + re.escape(name) + r'\b', legacy)
          ]
          if remaining_pointer_aliases:
              raise SystemExit(
                  'Legacy pointer aliases remain: ' + ', '.join(remaining_pointer_aliases)
              )

          # If a compatibility token is still used in code in another form, do
          # not delete the shim and hope for the best. The subsequent compile is
          # authoritative, but flag obvious bare uses here as well.
          legacy_path.write_text(legacy)

          window_path = Path('src/app/window_state.hpp')
          window = window_path.read_text()
          old_window = '''\n/*\n * Only the quarantined legacy page provider receives source-compatibility\n * spellings. Ordinary page/view translation units always use explicit owners.\n */\n#ifdef INFILTRATOR_SOFTWARE_LEGACY_PAGE_IMPL\n#include "app/legacy_page_aliases.hpp"\n#endif\n'''
          if old_window not in window:
              raise SystemExit('Expected legacy alias injection block not found in WindowState.')
          window_path.write_text(window.replace(old_window, '\n', 1))

          cmake_path = Path('CMakeLists.txt')
          cmake = cmake_path.read_text()
          old_cmake = '''\n# Compatibility rewriting is confined to the quarantined legacy page provider.\n# Only the temporary Discover/Updates state aliases remain; the duplicate\n# application entry point and shell have been removed.\nset_source_files_properties(src/app/legacy_page_impl.cpp PROPERTIES\n    COMPILE_DEFINITIONS\n        "INFILTRATOR_SOFTWARE_LEGACY_PAGE_IMPL=1")\n'''
          if old_cmake not in cmake:
              raise SystemExit('Expected legacy source compile-definition block not found.')
          cmake_path.write_text(cmake.replace(old_cmake, '\n', 1))

          contracts_path = Path('tests/source_contracts.py')
          contracts = contracts_path.read_text()
          contracts = contracts.replace(
              '# never a subtype of a page/controller. Compatibility rewriting is permitted\n# only for the quarantined legacy page provider and must only shrink.\n',
              '# never a subtype of a page/controller. Compatibility state rewriting is\n# forbidden: page implementations must name their owning state explicitly.\n',
              1,
          )
          old_contracts = '''assert "do not add new aliases" in window_state\nassert "INFILTRATOR_SOFTWARE_LEGACY_PAGE_IMPL" in window_state\nassert "INFILTRATOR_SOFTWARE_REPAIR_VIEW_LEGACY_ALIASES" not in window_state\nassert "INFILTRATOR_SOFTWARE_SYSTEM_VIEW_LEGACY_ALIASES" not in cmake\nassert "INFILTRATOR_SOFTWARE_REPAIR_VIEW_LEGACY_ALIASES" not in cmake\nassert "INFILTRATOR_SOFTWARE_LEGACY_PAGE_IMPL=1" in cmake\nassert "main=infiltrator_software_legacy_page_impl_main" not in cmake\n'''
          new_contracts = '''assert "do not add new aliases" in window_state\nassert "INFILTRATOR_SOFTWARE_LEGACY_PAGE_IMPL" not in window_state\nassert "INFILTRATOR_SOFTWARE_LEGACY_PAGE_IMPL" not in cmake\nassert "INFILTRATOR_SOFTWARE_REPAIR_VIEW_LEGACY_ALIASES" not in window_state\nassert "INFILTRATOR_SOFTWARE_SYSTEM_VIEW_LEGACY_ALIASES" not in cmake\nassert "INFILTRATOR_SOFTWARE_REPAIR_VIEW_LEGACY_ALIASES" not in cmake\nassert "main=infiltrator_software_legacy_page_impl_main" not in cmake\nassert not Path("src/app/legacy_page_aliases.hpp").exists()\n'''
          if old_contracts not in contracts:
              raise SystemExit('Expected legacy compatibility source-contract block not found.')
          contracts_path.write_text(contracts.replace(old_contracts, new_contracts, 1))

          alias_path.unlink()
          print(f'Migrated {len(matches)} explicit legacy state member accesses across {len(set(matches))} aliases.')
          PY

          git diff --check
          ! test -e src/app/legacy_page_aliases.hpp
          ! grep -R -Fq 'INFILTRATOR_SOFTWARE_LEGACY_PAGE_IMPL' src/app CMakeLists.txt
          ! grep -Fq 'state->discover_status' src/app/legacy_page_impl.cpp
          ! grep -Fq 'state->updates_list' src/app/legacy_page_impl.cpp
          grep -Fq 'state->discover.discover_status' src/app/legacy_page_impl.cpp
          grep -Fq 'state->updates.updates_list' src/app/legacy_page_impl.cpp

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream build-essential cmake debhelper dpkg-dev dbus-daemon gdb git gpgv libappstream-dev libcurl4-openssl-dev libgtk-3-dev libgtk-4-dev libglib2.0-dev libjson-glib-dev liblzma-dev libsqlite3-dev libxapp-dev pkg-config xvfb zlib1g-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify source contracts
        run: python3 tests/source_contracts.py

      - name: Graphical smoke test
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 20s xvfb-run -a ./build/infiltrator-software >launch.out 2>launch.err
          status=$?
          set -e
          cat launch.out || true
          cat launch.err || true
          test "$status" -eq 124

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add src/app/legacy_page_impl.cpp src/app/window_state.hpp src/app/legacy_page_aliases.hpp CMakeLists.txt tests/source_contracts.py
          git diff --cached --check
          git commit -m "Remove legacy page state alias layer"
          git push origin HEAD:main
