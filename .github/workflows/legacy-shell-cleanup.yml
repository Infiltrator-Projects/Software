name: One-shot legacy bridge cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/legacy-shell-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Remove duplicate review and controller bridges
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app/legacy_page_impl.cpp')
          source = path.read_text()

          include_anchor = '#include "app/history_controller.hpp"\n'
          added = (
              '#include "app/app_coordinator.hpp"\n'
              '#include "app/transaction_review.hpp"\n'
          )
          if added not in source:
              if include_anchor not in source:
                  raise SystemExit('Expected include anchor not found.')
              source = source.replace(include_anchor, added + include_anchor, 1)

          # transaction_review.cpp already owns the exact reviewed-transaction
          # dialog. Remove the older private duplicate and use the shared API.
          review_start = source.find('\nconst char *transaction_action_label(')
          review_end = source.find('\nvoid discover_details_clicked(', review_start)
          if review_start < 0 or review_end < 0:
              raise SystemExit('Duplicate transaction-review helper block not found.')
          source = source[:review_start] + '\n' + source[review_end:]
          source = source.replace(
              'make_transaction_confirmation_dialog(',
              'make_transaction_review_dialog(',
          )
          if 'make_transaction_confirmation_dialog' in source:
              raise SystemExit('Duplicate transaction-review call survived cleanup.')

          # Installed and History already have controllers; do not retain local
          # WindowState forwarding functions in this transitional provider.
          installed_start = source.find('\nvoid refresh_installed(WindowState *state)\n')
          installed_end = source.find('\nstruct UpdateProcessRun {', installed_start)
          if installed_start < 0 or installed_end < 0:
              raise SystemExit('Installed forwarding bridge not found.')
          source = source[:installed_start] + '\n' + source[installed_end:]
          source = re.sub(
              r'\brefresh_installed\(([A-Za-z_][A-Za-z0-9_]*)\);',
              r'refresh_installed_controller(&\1->installed);',
              source,
          )

          history_start = source.rfind('\nvoid refresh_history(WindowState *state)\n')
          select_start = source.find('\nvoid select_page(WindowState *state, const int index)\n', history_start)
          if history_start < 0 or select_start < 0:
              raise SystemExit('History/select forwarding bridges not found.')
          source = source[:history_start] + '\n' + source[select_start:]
          source = re.sub(
              r'\brefresh_history\(([A-Za-z_][A-Za-z0-9_]*)\);',
              r'refresh_history_controller(&\1->history);',
              source,
          )

          # Navigation is coordinated centrally now. Keep dashboard navigation
          # on that public boundary and remove the final local index bridge.
          source = source.replace(
              'select_page(state, index);',
              'select_app_page(state, static_cast<AppPage>(index));',
          )
          select_start = source.find('\nvoid select_page(WindowState *state, const int index)\n')
          namespace_close = source.rfind('\n} // namespace infiltrator::software::app\n')
          if select_start < 0 or namespace_close < 0 or select_start > namespace_close:
              raise SystemExit('Select-page forwarding bridge not found.')
          source = source[:select_start] + source[namespace_close:]

          for declaration in (
              'void refresh_installed(WindowState *state);\n',
              'void refresh_history(WindowState *state);\n',
              'void select_page(WindowState *state, int index);\n',
          ):
              source = source.replace(declaration, '', 1)

          for forbidden in (
              'void refresh_installed(WindowState *state)',
              'void refresh_history(WindowState *state)',
              'void select_page(WindowState *state',
              'make_transaction_confirmation_dialog',
              'refresh_installed(',
              'refresh_history(',
          ):
              if forbidden in source:
                  raise SystemExit(f'Retired bridge survived cleanup: {forbidden}')

          path.write_text(source)

          contracts_path = Path('tests/source_contracts.py')
          contracts = contracts_path.read_text()
          anchor = 'assert "void global_search_changed(" not in legacy_page_impl\n'
          addition = '''assert "make_transaction_confirmation_dialog" not in legacy_page_impl\nassert "make_transaction_review_dialog(" in legacy_page_impl\nassert "void refresh_installed(WindowState *state)" not in legacy_page_impl\nassert "void refresh_history(WindowState *state)" not in legacy_page_impl\nassert "void select_page(WindowState *state" not in legacy_page_impl\nassert "select_app_page(state, static_cast<AppPage>(index))" in legacy_page_impl\n'''
          if anchor not in contracts:
              raise SystemExit('Source-contract insertion anchor not found.')
          contracts_path.write_text(contracts.replace(anchor, anchor + addition, 1))
          PY

          git diff --check
          ! grep -Fq 'make_transaction_confirmation_dialog' src/app/legacy_page_impl.cpp
          ! grep -Fq 'void refresh_installed(WindowState *state)' src/app/legacy_page_impl.cpp
          ! grep -Fq 'void refresh_history(WindowState *state)' src/app/legacy_page_impl.cpp
          ! grep -Fq 'void select_page(WindowState *state' src/app/legacy_page_impl.cpp
          grep -Fq 'make_transaction_review_dialog(' src/app/legacy_page_impl.cpp

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream build-essential cmake debhelper dpkg-dev dbus-daemon gdb git gpgv libappstream-dev libcurl4-openssl-dev libgtk-3-dev libgtk-4-dev libglib2.0-dev libjson-glib-dev liblzma-dev libsqlite3-dev libxapp-dev pkg-config xvfb zlib1g-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify source contracts
        run: python3 tests/source_contracts.py

      - name: Graphical smoke test
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 20s xvfb-run -a ./build/infiltrator-software >launch.out 2>launch.err
          status=$?
          set -e
          cat launch.out || true
          cat launch.err || true
          test "$status" -eq 124

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add src/app/legacy_page_impl.cpp tests/source_contracts.py
          git diff --cached --check
          git commit -m "Remove transitional page bridges"
          git push origin HEAD:main
