# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot legacy shell cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/legacy-shell-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Remove duplicate legacy shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          legacy_path = Path('src/app/legacy_page_impl.cpp')
          legacy = legacy_path.read_text()

          shell_start_marker = '\nvoid global_search_changed(\n'
          select_start_marker = '\nvoid select_page(WindowState *state, const int index)\n'
          select_end_marker = '\n\ngboolean window_key_pressed(\n'
          for marker in (shell_start_marker, select_start_marker, select_end_marker):
              if marker not in legacy:
                  raise SystemExit(f'Expected legacy-shell marker not found: {marker!r}')

          shell_start = legacy.index(shell_start_marker)
          select_start = legacy.index(select_start_marker, shell_start)
          select_end = legacy.index(select_end_marker, select_start)
          select_bridge = legacy[select_start:select_end]

          legacy = (
              legacy[:shell_start]
              + select_bridge
              + '\n\n} // namespace infiltrator::software::app\n'
          )

          titlebar_asset = '''\nstatic constexpr const char kTitlebarLogoBase64[] =\n#include "titlebar_logo.inc"\n    ;\n'''
          if titlebar_asset not in legacy:
              raise SystemExit('Expected legacy titlebar asset declaration not found.')
          legacy = legacy.replace(titlebar_asset, '\n', 1)

          # These dependencies existed only for the retired duplicate shell.
          for include in (
              '#include "app/theme.hpp"\n',
              '#include "app/kernel_manager.hpp"\n',
              '#include "app/navigation_controller.hpp"\n',
              '#include "app/repair_view.hpp"\n',
              '#include "app/system_view.hpp"\n',
              '#include "app/preferences_dialog.hpp"\n',
          ):
              legacy = legacy.replace(include, '', 1)
          legacy = legacy.replace(
              'using infiltrator::software::ThemeController;\n', '', 1)

          if 'int main(' in legacy or 'void activate(' in legacy or 'GtkWidget *make_header_bar(' in legacy:
              raise SystemExit('Retired shell code survived legacy-page cleanup.')
          legacy_path.write_text(legacy)

          cmake_path = Path('CMakeLists.txt')
          cmake = cmake_path.read_text()
          old_cmake = '''# Compatibility rewriting is confined to the quarantined legacy page provider.\n# The main=... definition suppresses its obsolete duplicate entry point until\n# Discover/Updates extraction lets the provider be deleted.\nset_source_files_properties(src/app/legacy_page_impl.cpp PROPERTIES\n    COMPILE_DEFINITIONS\n        "main=infiltrator_software_legacy_page_impl_main;INFILTRATOR_SOFTWARE_LEGACY_PAGE_IMPL=1")\n'''
          new_cmake = '''# Compatibility rewriting is confined to the quarantined legacy page provider.\n# Only the temporary Discover/Updates state aliases remain; the duplicate\n# application entry point and shell have been removed.\nset_source_files_properties(src/app/legacy_page_impl.cpp PROPERTIES\n    COMPILE_DEFINITIONS\n        "INFILTRATOR_SOFTWARE_LEGACY_PAGE_IMPL=1")\n'''
          if old_cmake not in cmake:
              raise SystemExit('Expected legacy CMake compatibility block not found.')
          cmake_path.write_text(cmake.replace(old_cmake, new_cmake, 1))

          contracts_path = Path('tests/source_contracts.py')
          contracts = contracts_path.read_text()
          old_assert = 'assert "main=infiltrator_software_legacy_page_impl_main" in cmake\n'
          if old_assert not in contracts:
              raise SystemExit('Expected legacy-main source-contract assertion not found.')
          replacement = '''assert "main=infiltrator_software_legacy_page_impl_main" not in cmake\nassert "int main(" not in legacy_page_impl\nassert "void activate(" not in legacy_page_impl\nassert "GtkWidget *make_header_bar(" not in legacy_page_impl\nassert "void global_search_changed(" not in legacy_page_impl\n'''
          contracts_path.write_text(contracts.replace(old_assert, replacement, 1))
          PY

          git diff --check
          grep -Fq 'INFILTRATOR_SOFTWARE_LEGACY_PAGE_IMPL=1' CMakeLists.txt
          ! grep -Fq 'main=infiltrator_software_legacy_page_impl_main' CMakeLists.txt
          ! grep -Fq 'int main(' src/app/legacy_page_impl.cpp
          ! grep -Fq 'GtkWidget *make_header_bar(' src/app/legacy_page_impl.cpp

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream build-essential cmake debhelper dpkg-dev dbus-daemon gdb git gpgv libappstream-dev libcurl4-openssl-dev libgtk-3-dev libgtk-4-dev libglib2.0-dev libjson-glib-dev liblzma-dev libsqlite3-dev libxapp-dev pkg-config xvfb zlib1g-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify source contracts
        run: python3 tests/source_contracts.py

      - name: Graphical smoke test
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 20s xvfb-run -a ./build/infiltrator-software >launch.out 2>launch.err
          status=$?
          set -e
          cat launch.out || true
          cat launch.err || true
          test "$status" -eq 124

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add src/app/legacy_page_impl.cpp CMakeLists.txt tests/source_contracts.py
          git diff --cached --check
          git commit -m "Remove duplicate legacy application shell"
          git push origin HEAD:main
