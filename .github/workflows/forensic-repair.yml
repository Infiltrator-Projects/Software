name: Complete verified forensic repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/forensic-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply and verify repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/forensic_repair.py
          python3 .github/updates_boundary.py
          git -C src/infiltratr-common fetch --no-tags origin 086b79504e3480167a23fe620820f074002413a7
          git -C src/infiltratr-common checkout --detach 086b79504e3480167a23fe620820f074002413a7
          python3 tests/source_contracts.py
          python3 tests/documentation_contracts.py
          git diff --check
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git rm .github/forensic_repair.py .github/updates_boundary.py
          git add -A
          git commit -m "Complete forensic architecture hardening"
          git push origin HEAD:main
          if git ls-remote --exit-code --heads origin refs/heads/fix/mintupdate-coexistence-0.3.93 >/dev/null 2>&1; then
            git push origin --delete fix/mintupdate-coexistence-0.3.93
          fi
