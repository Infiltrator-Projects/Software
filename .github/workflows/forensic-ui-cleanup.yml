name: Prepare forensic responsiveness and UI cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forensic-ui-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Prepare forensic responsiveness and UI cleanup'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Apply audited cleanup and InfiltratorOS shell alignment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(tr -d '[:space:]' < VERSION)" = "0.3.60"
          test "$(tr -d '[:space:]' < src/infiltratr-common/VERSION)" = "1.19.36"
          test "$(git -C src/infiltratr-common rev-parse HEAD)" = "5e129851bbd7ac0b94bd8c2f48f32924016bdbda"

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Remove the last planner-origin argument from actual transaction
          # confirmation calls. The definition itself is skipped because it is
          # followed by a function body rather than a semicolon.
          def remove_last_call_argument(path, function_name):
              p = Path(path)
              text = p.read_text()
              positions = []
              start = 0
              needle = function_name + "("
              while True:
                  pos = text.find(needle, start)
                  if pos < 0:
                      break
                  positions.append(pos)
                  start = pos + len(needle)

              changed = 0
              for pos in reversed(positions):
                  open_pos = pos + len(function_name)
                  depth = 0
                  quote = None
                  escape = False
                  close_pos = None
                  for i in range(open_pos, len(text)):
                      ch = text[i]
                      if quote is not None:
                          if escape:
                              escape = False
                          elif ch == "\\":
                              escape = True
                          elif ch == quote:
                              quote = None
                          continue
                      if ch in ('"', "'"):
                          quote = ch
                          continue
                      if ch == '(':
                          depth += 1
                      elif ch == ')':
                          depth -= 1
                          if depth == 0:
                              close_pos = i
                              break
                  if close_pos is None:
                      raise SystemExit(f"{path}: unterminated {function_name} occurrence")
                  j = close_pos + 1
                  while j < len(text) and text[j].isspace():
                      j += 1
                  if j >= len(text) or text[j] != ';':
                      continue

                  inside = text[open_pos + 1:close_pos]
                  depth2 = 0
                  quote2 = None
                  escape2 = False
                  commas = []
                  for off, ch in enumerate(inside):
                      if quote2 is not None:
                          if escape2:
                              escape2 = False
                          elif ch == "\\":
                              escape2 = True
                          elif ch == quote2:
                              quote2 = None
                          continue
                      if ch in ('"', "'"):
                          quote2 = ch
                      elif ch in '([{':
                          depth2 += 1
                      elif ch in ')]}':
                          depth2 -= 1
                      elif ch == ',' and depth2 == 0:
                          commas.append(off)
                  if not commas:
                      raise SystemExit(f"{path}: no final argument in {function_name} call")
                  cut = open_pos + 1 + commas[-1]
                  text = text[:cut] + text[close_pos:]
                  changed += 1
              if changed == 0:
                  raise SystemExit(f"{path}: no {function_name} calls updated")
              p.write_text(text)
              return changed

          main = Path('src/app/main.cpp')
          text = main.read_text()

          old_sig = '''GtkWidget *make_transaction_confirmation_dialog(
              GtkWindow *parent,
              const char *title,
              const std::string &heading,
              const char *accept_label,
              const TransactionPlan &plan,
              const bool from_engine)
          '''
          new_sig = '''GtkWidget *make_transaction_confirmation_dialog(
              GtkWindow *parent,
              const char *title,
              const std::string &heading,
              const char *accept_label,
              const TransactionPlan &plan)
          '''
          if text.count(old_sig) != 1:
              raise SystemExit('main.cpp: transaction dialog signature drifted')
          text = text.replace(old_sig, new_sig, 1)

          old_summary = '''    if (plan.download_bytes > 0U) {
              summary << "  Download: " << display_size(plan.download_bytes) << ".";
          } else if (!from_engine) {
              summary << "  Download size: not reported by the compatibility planner.";
          }
          if (plan.disk_delta_bytes != 0) {
              summary << "  Disk change: "
                      << display_disk_delta(plan.disk_delta_bytes) << ".";
          } else if (!from_engine) {
              summary << "  Disk change: not reported by the compatibility planner.";
          }
          if (plan.touches_system) {
              summary << "\\nThis transaction includes system-critical components.";
          }
          if (from_engine) {
              summary << "\\nResolved by the native package engine against state "
                      << "generation " << plan.state_generation << ".";
          } else {
              summary << "\\nResolved by the transitional APT compatibility planner.";
          }
          '''
          new_summary = '''    if (plan.download_bytes > 0U) {
              summary << "  Download: " << display_size(plan.download_bytes) << ".";
          }
          if (plan.disk_delta_bytes != 0) {
              summary << "  Disk change: "
                      << display_disk_delta(plan.disk_delta_bytes) << ".";
          }
          if (plan.touches_system) {
              summary << "\\nThis transaction includes system-critical components.";
          }
          summary << "\\nResolved by the native package engine against state "
                  << "generation " << plan.state_generation << ".";
          '''
          if text.count(old_summary) != 1:
              raise SystemExit('main.cpp: compatibility planner summary drifted')
          text = text.replace(old_summary, new_summary, 1)

          old_result = '''struct DiscoverPlanResult {
              std::optional<TransactionPlan> plan;
              std::string error;
              bool from_engine{false};
          };
          '''
          new_result = '''struct DiscoverPlanResult {
              std::optional<TransactionPlan> plan;
              std::string error;
          };
          '''
          if text.count(old_result) != 1:
              raise SystemExit('main.cpp: DiscoverPlanResult drifted')
          text = text.replace(old_result, new_result, 1)
          if text.count('        result->from_engine = result->plan.has_value();\n') != 1:
              raise SystemExit('main.cpp: stale planner-origin assignment drifted')
          text = text.replace('        result->from_engine = result->plan.has_value();\n', '', 1)
          main.write_text(text)
          main_call_count = remove_last_call_argument('src/app/main.cpp', 'make_transaction_confirmation_dialog')
          if main_call_count < 2:
              raise SystemExit(f'main.cpp: expected at least two transaction confirmation calls, got {main_call_count}')

          # System still records whether read-only installed inventory came from
          # the engine or the deliberate dpkg fallback. Only the transaction
          # planner-origin parameter is obsolete.
          replace_once(
              'src/app/system_view.cpp',
              '''GtkWidget *make_transaction_confirmation_dialog(
              GtkWindow *parent,
              const char *title,
              const std::string &heading,
              const char *accept_label,
              const TransactionPlan &plan,
              bool from_engine);
          ''',
              '''GtkWidget *make_transaction_confirmation_dialog(
              GtkWindow *parent,
              const char *title,
              const std::string &heading,
              const char *accept_label,
              const TransactionPlan &plan);
          ''')
          system_call_count = remove_last_call_argument('src/app/system_view.cpp', 'make_transaction_confirmation_dialog')
          if system_call_count < 1:
              raise SystemExit('system_view.cpp: expected transaction confirmation call')

          replace_once(
              'src/app/window_state.hpp',
              '    GtkWidget *theme_button{};\n',
              '')

          # Use Common for case-insensitive theme matching rather than retaining
          # a local allocation/lowercasing helper.
          replace_once(
              'src/app/theme.cpp',
              '#include <infiltratr/config.h>\n',
              '#include <infiltratr/config.h>\n#include <infiltratr/core.h>\n')
          replace_once(
              'src/app/theme.cpp',
              '''    if (theme_name != nullptr) {
                  gchar *lower = g_ascii_strdown(theme_name, -1);
                  dark = dark ||
                         (lower != nullptr &&
                          std::strstr(lower, "dark") != nullptr);
                  g_free(lower);
                  g_free(theme_name);
              }
          ''',
              '''    if (theme_name != nullptr) {
                  dark = dark ||
                         infiltratr_ascii_contains_ci(theme_name, "dark");
                  g_free(theme_name);
              }
          ''')
          replace_once(
              'src/app/theme.cpp',
              '    const std::string card_hover = colour(palette->card_hover_rgb);\n',
              '    const std::string card_hover = colour(palette->card_hover_rgb);\n    const std::string surface_hover = colour(palette->surface_hover_rgb);\n')
          replace_once(
              'src/app/theme.cpp',
              '    const std::string titlebar = colour(palette->titlebar_rgb);\n',
              '')
          replace_once(
              'src/app/theme.cpp',
              '''        << "headerbar.infiltrator-titlebar { min-height: 58px; "
                  << "background-image: linear-gradient(to right, #06131f, #08263a); "
          ''',
              '''        << "headerbar.infiltrator-titlebar { min-height: 58px; "
                  << "background: " << panel << "; "
          ''')

          old_nav = '''        << ".sidebar { background-image: linear-gradient(180deg, "
                  << panel << ", " << titlebar << "); border-right: 1px solid "
                  << border << "; }"
                  << ".nav-list { background: transparent; }"
                  << ".nav-row { margin: 4px 0; padding: 5px 7px; "
                  << "border: 1px solid transparent; border-radius: 12px; }"
                  << ".nav-row:hover { background: " << card_hover << "; }"
                  << ".nav-row:selected { background-image: linear-gradient(105deg, "
                  << "#2f67ff, #5137d8); border-color: #6f6dff; "
                  << "box-shadow: 0 7px 18px rgba(20,32,95,0.34); }"
                  << ".nav-icon-well { min-width: 42px; min-height: 42px; "
                  << "background: transparent; border: 1px solid transparent; "
                  << "border-radius: 10px; }"
                  << ".nav-row:selected .nav-icon-well { "
                  << "background: rgba(255,255,255,0.13); "
                  << "border-color: rgba(255,255,255,0.12); }"
          '''
          new_nav = '''        << ".sidebar { background: " << panel
                  << "; border-right: 1px solid " << border
                  << "; padding: 12px 9px; }"
                  << ".nav-list { background: transparent; }"
                  << ".nav-row { min-height: 50px; margin: 2px 4px; padding: 7px 9px; "
                  << "border: 1px solid transparent; border-radius: 12px; }"
                  << ".nav-row:hover { background: " << surface_hover << "; }"
                  << ".nav-row:selected { background: " << select_bg
                  << "; border-color: " << neutral << "; box-shadow: none; }"
                  << ".nav-icon-well { min-width: 38px; min-height: 38px; "
                  << "background: " << surface << "; border: 1px solid " << border
                  << "; border-radius: 11px; padding: 5px; }"
          '''
          replace_once('src/app/theme.cpp', old_nav, new_nav)
          replace_once(
              'src/app/theme.cpp',
              '''        << ".nav-row:selected .nav-label { color: #ffffff; }"
                  << ".nav-row:selected .nav-subtitle { color: rgba(255,255,255,0.82); }"
          ''',
              '''        << ".nav-row:selected .nav-label, .nav-row:selected .nav-subtitle { color: "
                  << accent_fg << "; }"
          ''')
          replace_once(
              'src/app/theme.cpp',
              '        << ".nav-row:selected image { color: #ffffff; }"\n',
              '        << ".nav-row:selected image { color: " << accent_fg << "; }"\n')

          # Adopt the same semantic shell classes as current System Settings;
          # Software keeps its authored raster identity mark and product copy.
          replace_once(
              'src/app/main.cpp',
              '    gtk_widget_add_css_class(\n        bar, "infiltrator-titlebar");\n',
              '    gtk_widget_add_css_class(\n        bar, "infiltrator-titlebar");\n    gtk_widget_add_css_class(bar, "shell-header");\n')
          replace_once(
              'src/app/main.cpp',
              '    GtkWidget *root = gtk_box_new(GTK_ORIENTATION_VERTICAL, 0);\n    gtk_window_set_child(GTK_WINDOW(window), root);\n',
              '    GtkWidget *root = gtk_box_new(GTK_ORIENTATION_VERTICAL, 0);\n    gtk_widget_add_css_class(root, "app-shell");\n    gtk_window_set_child(GTK_WINDOW(window), root);\n')

          # Update CI so it protects the current InfiltratorOS shell contract
          # instead of resurrecting the superseded gradient prototype.
          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          text = text.replace(
              '          assert "linear-gradient(to right, #06131f, #08263a)" in theme\n',
              '          assert "linear-gradient(to right, #06131f, #08263a)" not in theme\n          assert "linear-gradient(105deg, #2f67ff, #5137d8)" not in theme\n          assert \'<< ".nav-row:selected { background: " << select_bg\' in theme\n          assert \'<< ".sidebar { background: " << panel\' in theme\n          assert "infiltratr_ascii_contains_ci" in theme\n          assert \'"shell-header"\' in app\n          assert \'"app-shell"\' in app\n          assert "transitional APT compatibility planner" not in app\n          assert "theme_button" not in app\n')
          text = text.replace(
              '# Sidebar convergence: target-like semantic icons, vivid selection,\n',
              '# Sidebar convergence: semantic icons and Common-driven selection,\n')
          ci.write_text(text)

          # Forensic release gate for exactly the old paths removed here.
          app_text = '\n'.join(p.read_text() for p in Path('src/app').glob('*.[ch]pp'))
          theme_text = Path('src/app/theme.cpp').read_text()
          assert 'transitional APT compatibility planner' not in app_text
          assert 'Download size: not reported by the compatibility planner.' not in app_text
          assert 'theme_button' not in app_text
          assert 'AptBackend' not in app_text
          assert 'linear-gradient(to right, #06131f, #08263a)' not in theme_text
          assert 'linear-gradient(105deg, #2f67ff, #5137d8)' not in theme_text
          assert 'infiltratr_ascii_contains_ci' in theme_text
          assert 'INFILTRATR_COMMON_EXPECTED_VERSION "1.19.36"' in Path('CMakeLists.txt').read_text()
          assert 'INFILTRATR_COMMON_EXPECTED_COMMIT "5e129851bbd7ac0b94bd8c2f48f32924016bdbda"' in Path('CMakeLists.txt').read_text()
          PY

          rm .github/workflows/forensic-ui-cleanup.yml

          git diff --check
          git status --short
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add src/app/main.cpp src/app/system_view.cpp src/app/window_state.hpp src/app/theme.cpp .github/workflows/ci.yml .github/workflows/forensic-ui-cleanup.yml
          git commit -m 'Clean remaining UI transition code and align shell'
          git push origin HEAD:main
